<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Conveyor Track Gradient -->
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Rail Silver Gradient -->
    <linearGradient id="railGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Marble Red Radial -->
    <radialGradient id="marbleRed" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="35%" stop-color="#ef4444" />
      <stop offset="85%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </radialGradient>

    <!-- Marble Blue Radial -->
    <radialGradient id="marbleBlue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="85%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>

    <!-- Marble Yellow Radial -->
    <radialGradient id="marbleYellow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </radialGradient>

    <!-- Marble Green Radial -->
    <radialGradient id="marbleGreen" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="85%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Soft Ambient Glow -->
  <circle cx="256" cy="256" r="210" fill="#ffffff" opacity="0.12" />

  <!-- Floating Factory Pedestal Base -->
  <ellipse cx="256" cy="380" rx="190" ry="60" fill="#0369a1" opacity="0.4" />
  <ellipse cx="256" cy="370" rx="190" ry="55" fill="#f8fafc" filter="url(#shadow)" />

  <!-- Conveyor Track Oval Loop -->
  <g filter="url(#shadow)">
    <!-- Track Floor -->
    <ellipse cx="256" cy="270" rx="160" ry="85" fill="none" stroke="url(#trackGrad)" stroke-width="52" />
    <!-- Outer Rail -->
    <ellipse cx="256" cy="265" rx="186" ry="98" fill="none" stroke="url(#railGrad)" stroke-width="8" />
    <!-- Inner Rail -->
    <ellipse cx="256" cy="275" rx="134" ry="72" fill="none" stroke="url(#railGrad)" stroke-width="8" />
  </g>

  <!-- Hazard Stripes on Track -->
  <path d="M 120 250 L 135 275" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
  <path d="M 370 280 L 385 305" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
  <path d="M 245 180 L 265 180" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
  <path d="M 245 355 L 265 355" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />

  <!-- Collector Crate (Docked Right) -->
  <g transform="translate(370, 220)" filter="url(#shadow)">
    <rect x="-35" y="-25" width="70" height="55" rx="10" fill="#d97706" stroke="#b45309" stroke-width="4" />
    <ellipse cx="0" cy="-25" rx="28" ry="12" fill="#3b82f6" stroke="#ffffff" stroke-width="3" />
    <!-- Crate Badge -->
    <rect x="-18" y="-6" width="36" height="16" rx="4" fill="#0284c7" />
    <circle cx="-6" cy="2" r="3" fill="#ffffff" />
    <circle cx="6" cy="2" r="3" fill="#ffffff" />
  </g>

  <!-- Glossy 3D Marbles Riding Loop -->
  <!-- 1. Sapphire Blue Marble (Entering Crate) -->
  <circle cx="340" cy="235" r="32" fill="url(#marbleBlue)" filter="url(#shadow)" />
  <ellipse cx="330" cy="225" rx="10" ry="6" fill="#ffffff" opacity="0.65" transform="rotate(-30 330 225)" />

  <!-- 2. Ruby Red Marble (Front Center) -->
  <circle cx="230" cy="355" r="38" fill="url(#marbleRed)" filter="url(#shadow)" />
  <ellipse cx="218" cy="342" rx="12" ry="7" fill="#ffffff" opacity="0.75" transform="rotate(-30 218 342)" />

  <!-- 3. Emerald Green Marble (Left Turn) -->
  <circle cx="105" cy="265" r="34" fill="url(#marbleGreen)" filter="url(#shadow)" />
  <ellipse cx="95" cy="255" rx="10" ry="6" fill="#ffffff" opacity="0.7" transform="rotate(-30 95 255)" />

  <!-- 4. Sun Amber Marble (Back Straight) -->
  <circle cx="210" cy="185" r="28" fill="url(#marbleYellow)" filter="url(#shadow)" />
  <ellipse cx="202" cy="177" rx="8" ry="5" fill="#ffffff" opacity="0.7" transform="rotate(-30 202 177)" />

  <!-- Sparkles -->
  <path d="M 330 195 Q 340 195 340 185 Q 340 195 350 195 Q 340 195 340 205 Q 340 195 330 195 Z" fill="#ffffff" />
  <path d="M 170 330 Q 178 330 178 322 Q 178 330 186 330 Q 178 330 178 338 Q 178 330 170 330 Z" fill="#fef08a" />
</svg>
