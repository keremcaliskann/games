<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>ARCADE 3D // HTML5 WebGL Oyun Portalı</title>
    <meta name="description" content="Anında oynanabilir 60 FPS 3B WebGL oyun portalı. İndirme yok, kurulum yok!" />
    <meta name="theme-color" content="#f1f5f9" />
    <link rel="icon" type="image/svg+xml" href="./smash-karts-brawl-3d/icon.svg" />

    <!-- Mobile Web App Capability -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- OpenGraph Social Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ARCADE 3D // HTML5 WebGL Oyun Portalı" />
    <meta property="og:description" content="Anında oynanabilir 60 FPS 3B WebGL oyun portalı." />
    <meta property="og:url" content="https://keremcaliskann.github.io/games/" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root {
        --bg-page: #f1f5f9;
        --bg-header: rgba(255, 255, 255, 0.92);
        --text-main: #0f172a;
        --text-muted: #475569;
        --accent: #2563eb;
        --play-green: #22c55e;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: linear-gradient(180deg, #e2e8f0 0%, #f1f5f9 35%, #f8fafc 100%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
      }

      /* Yandex Games Style Sticky Top Navbar */
      .yg-navbar {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--bg-header);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid rgba(148, 163, 184, 0.25);
        padding: 12px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        flex-wrap: wrap;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
      }

      .yg-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: inherit;
      }

      .yg-brand-logo {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: linear-gradient(135deg, #ef4444, #f59e0b);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        box-shadow: 0 6px 14px rgba(239, 68, 68, 0.3);
      }

      .yg-brand-text {
        display: flex;
        flex-direction: column;
      }

      .yg-brand-title {
        font-size: 19px;
        font-weight: 900;
        letter-spacing: -0.5px;
        color: #0f172a;
        line-height: 1.1;
      }

      .yg-brand-sub {
        font-size: 11px;
        font-weight: 700;
        color: #64748b;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }

      /* Category Pills */
      .yg-categories {
        display: flex;
        align-items: center;
        gap: 8px;
        overflow-x: auto;
        padding: 2px 0;
      }

      .yg-cat-btn {
        background: #f1f5f9;
        border: 1px solid #cbd5e1;
        color: #334155;
        padding: 8px 15px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.16s ease;
      }

      .yg-cat-btn:hover {
        background: #e2e8f0;
        color: #0f172a;
      }

      .yg-cat-btn.active {
        background: #0f172a;
        border-color: #0f172a;
        color: #ffffff;
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
      }

      /* Search Box */
      .yg-search-wrap {
        position: relative;
        min-width: 220px;
      }

      .yg-search-input {
        width: 100%;
        padding: 9px 14px 9px 34px;
        border-radius: 999px;
        border: 1px solid #cbd5e1;
        background: #f8fafc;
        font-size: 13px;
        font-weight: 600;
        color: #0f172a;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .yg-search-input:focus {
        border-color: #3b82f6;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      }

      .yg-search-icon {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 13px;
        color: #64748b;
        pointer-events: none;
      }

      /* Main Catalog Container */
      .yg-container {
        max-width: 1440px;
        width: 100%;
        margin: 0 auto;
        padding: 26px 28px 64px;
        flex: 1;
      }

      .yg-section-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .yg-section-title {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: -0.4px;
        color: #0f172a;
      }

      .yg-section-count {
        font-size: 13px;
        font-weight: 700;
        color: #64748b;
      }

      /* Yandex Games Full-Bleed Visual Poster Grid */
      .yg-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
        gap: 22px;
      }

      /* Game Card — Full Size Visual with Hover Expansion */
      .yg-card {
        position: relative;
        aspect-ratio: 16 / 10;
        border-radius: 22px;
        overflow: hidden;
        text-decoration: none;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        box-shadow:
          0 10px 25px -5px rgba(15, 23, 42, 0.14),
          0 0 0 1px rgba(15, 23, 42, 0.06);
        transition:
          transform 0.26s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.26s cubic-bezier(0.22, 1, 0.36, 1),
          z-index 0s;
        z-index: 1;
        cursor: pointer;
        user-select: none;
      }

      .yg-card:hover,
      .yg-card:focus-visible {
        transform: scale(1.06) translateY(-6px);
        z-index: 30;
        box-shadow:
          0 26px 55px -8px rgba(15, 23, 42, 0.35),
          0 0 0 3px #ffffff;
      }

      /* Full-Bleed Artwork Background */
      .yg-poster-bg {
        position: absolute;
        inset: 0;
        background: var(--card-gradient, linear-gradient(135deg, #2563eb, #38bdf8));
        z-index: 1;
        transition: transform 0.35s ease, filter 0.35s ease;
      }

      /* Subtle Geometric Pattern & Sunlit Radial Glow on Poster */
      .yg-poster-bg::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.32) 0%, transparent 62%),
          repeating-linear-gradient(
            45deg,
            rgba(255, 255, 255, 0.04) 0px,
            rgba(255, 255, 255, 0.04) 12px,
            transparent 12px,
            transparent 24px
          );
      }

      .yg-card:hover .yg-poster-bg {
        transform: scale(1.08);
        filter: brightness(0.92);
      }

      /* Top Badges Row */
      .yg-top-badges {
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 4;
        pointer-events: none;
      }

      .yg-genre-pill {
        background: rgba(15, 23, 42, 0.45);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #ffffff;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        padding: 4px 10px;
        border-radius: 999px;
      }

      .yg-hot-badge {
        background: linear-gradient(135deg, #facc15, #f97316);
        color: #0f172a;
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.7px;
        padding: 4px 9px;
        border-radius: 999px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }

      /* Center Full-Scale Hero Visual Icon */
      .yg-hero-art {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
        padding-bottom: 18px;
        transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .yg-hero-img {
        width: 104px;
        height: 104px;
        object-fit: contain;
        filter: drop-shadow(0 14px 20px rgba(15, 23, 42, 0.35));
        transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .yg-hero-emoji {
        font-size: 72px;
        filter: drop-shadow(0 12px 18px rgba(15, 23, 42, 0.32));
      }

      .yg-card:hover .yg-hero-art {
        transform: translateY(-34px) scale(0.76);
      }

      /* Bottom Scrim & Expandable Info Drawer */
      .yg-card-overlay {
        position: relative;
        z-index: 3;
        background: linear-gradient(
          180deg,
          transparent 0%,
          rgba(15, 23, 42, 0.68) 38%,
          rgba(15, 23, 42, 0.94) 100%
        );
        padding: 28px 16px 14px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        transition: background 0.25s ease;
      }

      .yg-card-title {
        font-size: 17px;
        font-weight: 900;
        letter-spacing: -0.3px;
        line-height: 1.15;
        color: #ffffff;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      }

      /* Hidden Details Drawer that Expands on Hover */
      .yg-hover-details {
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        transform: translateY(8px);
        transition:
          max-height 0.28s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.22s ease,
          transform 0.24s ease,
          margin-top 0.24s ease;
      }

      .yg-card:hover .yg-hover-details,
      .yg-card:focus-visible .yg-hover-details {
        max-height: 130px;
        opacity: 1;
        transform: translateY(0);
        margin-top: 7px;
      }

      .yg-short-desc {
        font-size: 12px;
        line-height: 1.35;
        color: #e2e8f0;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin-bottom: 8px;
      }

      .yg-card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .yg-mini-tags {
        display: flex;
        gap: 5px;
        overflow: hidden;
      }

      .yg-mini-tag {
        background: rgba(255, 255, 255, 0.16);
        color: #f8fafc;
        font-size: 10px;
        font-weight: 700;
        padding: 3px 7px;
        border-radius: 6px;
        white-space: nowrap;
      }

      .yg-play-pill {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: #ffffff;
        font-size: 11.5px;
        font-weight: 900;
        letter-spacing: 0.6px;
        padding: 6px 13px;
        border-radius: 999px;
        white-space: nowrap;
        box-shadow: 0 4px 12px rgba(34, 197, 94, 0.45);
      }

      footer {
        text-align: center;
        padding: 24px 20px;
        font-size: 13px;
        color: #64748b;
        border-top: 1px solid rgba(148, 163, 184, 0.2);
        background: rgba(255, 255, 255, 0.6);
      }

      footer a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 700;
      }

      @media (max-width: 768px) {
        .yg-navbar {
          padding: 12px 16px;
        }
        .yg-container {
          padding: 18px 16px 44px;
        }
        .yg-grid {
          grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
          gap: 14px;
        }
        .yg-hero-img {
          width: 76px;
          height: 76px;
        }
        .yg-card-title {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Top Sticky Bar (Yandex Games Style) -->
    <header class="yg-navbar">
      <a href="./" class="yg-brand">
        <div class="yg-brand-logo">🎮</div>
        <div class="yg-brand-text">
          <span class="yg-brand-title">ARCADE 3D</span>
          <span class="yg-brand-sub">Anında Oyna • 60 FPS WebGL</span>
        </div>
      </a>

      <div class="yg-categories" id="yg-categories">
        <button class="yg-cat-btn active" data-cat="all" type="button">🔥 Tüm Oyunlar</button>
        <button class="yg-cat-btn" data-cat="io" type="button">🏎️ .io &amp; Arena</button>
        <button class="yg-cat-btn" data-cat="physics" type="button">💥 3D Fizik &amp; Aksiyon</button>
        <button class="yg-cat-btn" data-cat="puzzle" type="button">🧩 3D ASMR Bulmaca</button>
      </div>

      <div class="yg-search-wrap">
        <span class="yg-search-icon">🔍</span>
        <input
          type="search"
          id="yg-search"
          class="yg-search-input"
          placeholder="Oyun ara..."
          aria-label="Oyun ara"
        />
      </div>
    </header>

    <!-- Main Games Grid -->
    <main class="yg-container">
      <div class="yg-section-header">
        <h1 class="yg-section-title" id="yg-section-title">Popüler 3D Oyunlar</h1>
        <span class="yg-section-count" id="yg-game-count">11 Oyun</span>
      </div>

      <div class="yg-grid" id="games-grid">
        <!-- Pre-rendered fallback cards; hydrated dynamically from games.json -->
      </div>
    </main>

    <footer>
      Crafted by <a href="https://github.com/keremcaliskann" target="_blank" rel="noopener">Kerem Çalışkan</a> // 60 FPS Three.js &amp; Rapier 3D Engine
    </footer>

    <script>
      const FALLBACK_GAMES = [
        {
          id: 'rally-horizon-3d',
          title: 'RALLY HORIZON 3D // TIME ATTACK & DRIFT',
          description: 'Asfalt, çakıl ve karlı dağ etaplarında ralli aracınla drift yap, hayalet rakipleri geç ve altın madalyayı kazan!',
          path: './rally-horizon-3d/',
          tags: ['3D Rally', 'Time Attack', '60 FPS'],
          icon: './rally-horizon-3d/icon.svg',
          iconEmoji: '🏎️',
          featured: true,
          accentGradient: 'linear-gradient(135deg, #38bdf8, #0284c7)'
        },
        {
          id: 'smash-karts-brawl-3d',
          title: 'SMASH KARTS 3D // ROCKET BATTLE ROYALE .IO',
          description: 'Zırhlı kartınla drift yap, gizemli silah kutularını kır ve 11 rakibe karşı roketlerle hayatta kal!',
          path: './smash-karts-brawl-3d/',
          tags: ['.io Royale', 'Kart Combat', '60 FPS'],
          icon: './smash-karts-brawl-3d/icon.svg',
          iconEmoji: '🏎️',
          featured: true,
          accentGradient: 'linear-gradient(135deg, #ef4444, #f59e0b)'
        },
        {
          id: 'bridge-rush-io-3d',
          title: 'BRIDGE RACE 3D // STAIR BUILDER .IO',
          description: 'Kendi rengindeki tuğlaları topla, rakipleri devir ve 3 katlı adalarda merdivenleri ilk sen tamamla!',
          path: './bridge-rush-io-3d/',
          tags: ['.io Race', 'Bridge Builder', '60 FPS'],
          icon: './bridge-rush-io-3d/icon.svg',
          iconEmoji: '🧱',
          featured: true,
          accentGradient: 'linear-gradient(135deg, #2563eb, #38bdf8)'
        },
        {
          id: 'stumble-knockout-royale-3d',
          title: 'PARTY KNOCKOUT 3D // OBSTACLE ROYALE .IO',
          description: '15 rakibe karşı 3 turlu çılgın parkurda koş, dönen çekiçlerden kaç ve altın tacı kazan!',
          path: './stumble-knockout-royale-3d/',
          tags: ['.io Royale', 'Obstacle Course', '60 FPS'],
          icon: './stumble-knockout-royale-3d/icon.svg',
          iconEmoji: '👑',
          featured: true,
          accentGradient: 'linear-gradient(135deg, #ec4899, #8b5cf6)'
        },
        {
          id: 'bumper-smash-io-3d',
          title: 'BUMPER SMASH 3D // ARENA KNOCKOUT .IO',
          description: '4 farklı arenada rakiplerine çarpıp denize uçur, aracını büyüt ve son kalan şampiyon ol!',
          path: './bumper-smash-io-3d/',
          tags: ['.io Arena', 'Bumper Knockout', '60 FPS'],
          icon: './bumper-smash-io-3d/icon.svg',
          iconEmoji: '🛞',
          featured: true,
          accentGradient: 'linear-gradient(135deg, #f97316, #ea580c)'
        },
        {
          id: 'ragdoll-archers-duel-3d',
          title: 'ARCHER DUEL 3D // RAGDOLL SHOWDOWN',
          description: 'Kuleler arası balistik okçuluk düellosu! Kafadan vuruşlarla rakipleri ragdoll fiziğiyle uçur.',
          path: './ragdoll-archers-duel-3d/',
          tags: ['3D Physics', 'Ragdoll Archery', '60 FPS'],
          icon: './ragdoll-archers-duel-3d/icon.svg',
          iconEmoji: '🏹',
          featured: true,
          accentGradient: 'linear-gradient(135deg, #2563eb, #f59e0b)'
        },
        {
          id: 'physics-drop-merge-3d',
          title: 'DROP MERGE 3D // SPHERE SUIKA',
          description: 'Aynı renkteki 3B küreleri cam fanusa bırakıp birleştirerek dev Güneş çekirdeğine ulaş!',
          path: './physics-drop-merge-3d/',
          tags: ['3D Physics', 'Suika Merge', '60 FPS'],
          icon: './physics-drop-merge-3d/icon.svg',
          iconEmoji: '🍉',
          featured: true,
          accentGradient: 'linear-gradient(135deg, #22c55e, #16a34a)'
        },
        {
          id: 'voxel-craft-smash-3d',
          title: 'VOXEL SMASH 3D // BLOCK MINER & TURRET',
          description: 'Voksel kalelerini parçala, yürüyen golemleri durdur ve parlayan ganimet küplerini topla!',
          path: './voxel-craft-smash-3d/',
          tags: ['Voxel Sandbox', 'Destruction', '60 FPS'],
          icon: './voxel-craft-smash-3d/icon.svg',
          iconEmoji: '⛏️',
          featured: true,
          accentGradient: 'linear-gradient(135deg, #f97316, #eab308)'
        },
        {
          id: 'hole-city-io-3d',
          title: 'HOLE SWALLOW 3D // CITY ARENA .IO',
          description: 'Kara deliğinle şehirdeki araçları ve binaları yutarak büyü, rakiplerini içine çek!',
          path: './hole-city-io-3d/',
          tags: ['.io Arena', '3D Physics', '60 FPS'],
          icon: './hole-city-io-3d/icon.svg',
          iconEmoji: '🕳️',
          featured: true,
          accentGradient: 'linear-gradient(135deg, #06b6d4, #8b5cf6)'
        },
        {
          id: 'hexa-sort-3d',
          title: 'HEXA SORT 3D // CASCADE STACK',
          description: 'Altıgen taşları petek ızgaraya yerleştir, renkleri eşleştir ve ASMR domino serileri yakala!',
          path: './hexa-sort-3d/',
          tags: ['3D Puzzle', 'Hexa Sort', 'ASMR'],
          icon: './hexa-sort-3d/icon.svg',
          iconEmoji: '🔷',
          featured: false,
          accentGradient: 'linear-gradient(135deg, #f59e0b, #f97316)'
        },
        {
          id: 'cyber-arrow-3d',
          title: 'CYBER ARROW 3D // SPATIAL ESCAPE',
          description: '3B yapıyı döndür, önü açık ok bloklarına dokunarak yapıyı tamamen çöz!',
          path: './cyber-arrow-3d/',
          tags: ['3D Puzzle', 'Spatial Logic', 'ASMR'],
          icon: './cyber-arrow-3d/icon.svg',
          iconEmoji: '🎯',
          featured: false,
          accentGradient: 'linear-gradient(135deg, #6366f1, #4f46e5)'
        }
      ];

      let allGames = [...FALLBACK_GAMES];
      let activeCategory = 'all';
      let searchQuery = '';

      function classifyCategory(g) {
        const str = ((g.title || '') + ' ' + (g.tags || []).join(' ')).toLowerCase();
        if (str.includes('.io') || str.includes('royale') || str.includes('race')) return 'io';
        if (str.includes('puzzle') || str.includes('sort') || str.includes('jam') || str.includes('arrow')) return 'puzzle';
        return 'physics';
      }

      function renderCard(g) {
        const parts = (g.title || '').split('//');
        const mainTitle = parts[0].trim();
        const genreTag = (parts[1] || g.tags?.[0] || '3D OYUN').trim();
        const grad = g.accentGradient || 'linear-gradient(135deg, #2563eb, #38bdf8)';
        const fb = g.iconEmoji || '🎮';
        const shortDesc = (g.description || '').slice(0, 115);
        const miniTags = (g.tags || []).slice(0, 2);

        return `
          <a href="${g.path}" class="yg-card" style="--card-gradient: ${grad};">
            <div class="yg-poster-bg"></div>
            <div class="yg-top-badges">
              <span class="yg-genre-pill">${genreTag}</span>
              ${g.featured ? '<span class="yg-hot-badge">🔥 POPÜLER</span>' : ''}
            </div>
            <div class="yg-hero-art">
              <img
                src="${g.icon}"
                alt="${mainTitle}"
                class="yg-hero-img"
                onerror="this.onerror=null; this.outerHTML='<span class=\\'yg-hero-emoji\\'>${fb}</span>';"
              />
            </div>
            <div class="yg-card-overlay">
              <h2 class="yg-card-title">${mainTitle}</h2>
              <div class="yg-hover-details">
                <p class="yg-short-desc">${shortDesc}</p>
                <div class="yg-card-footer">
                  <div class="yg-mini-tags">
                    ${miniTags.map((t) => `<span class="yg-mini-tag">${t}</span>`).join('')}
                  </div>
                  <span class="yg-play-pill">▶ OYNA</span>
                </div>
              </div>
            </div>
          </a>
        `;
      }

      function updateGrid() {
        const grid = document.getElementById('games-grid');
        const countEl = document.getElementById('yg-game-count');
        const filtered = allGames.filter((g) => {
          if (g.active === false || g.id === 'bus-escape-jam-3d') return false;
          if (activeCategory !== 'all' && classifyCategory(g) !== activeCategory) return false;
          if (searchQuery) {
            const hay = ((g.title || '') + ' ' + (g.description || '') + ' ' + (g.tags || []).join(' ')).toLowerCase();
            if (!hay.includes(searchQuery)) return false;
          }
          return true;
        });

        grid.innerHTML = filtered.map(renderCard).join('');
        if (countEl) {
          countEl.textContent = `${filtered.length} Oyun`;
        }
      }

      // Bind category buttons
      document.getElementById('yg-categories')?.addEventListener('click', (e) => {
        const btn = e.target.closest('.yg-cat-btn');
        if (!btn) return;
        document.querySelectorAll('.yg-cat-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.getAttribute('data-cat') || 'all';
        updateGrid();
      });

      // Bind search input
      document.getElementById('yg-search')?.addEventListener('input', (e) => {
        searchQuery = (e.target.value || '').trim().toLowerCase();
        updateGrid();
      });

      async function loadCatalog() {
        updateGrid();
        try {
          const res = await fetch('./games.json');
          if (!res.ok) return;
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            // Merge concise Turkish descriptions from FALLBACK_GAMES where matching
            const descMap = new Map(FALLBACK_GAMES.map((f) => [f.id, f.description]));
            allGames = data
              .filter((g) => g.active !== false && g.id !== 'bus-escape-jam-3d')
              .map((g) => ({
                ...g,
                description: descMap.get(g.id) || g.description
              }));
            updateGrid();
          }
        } catch {
          // Offline / file:// fallback already rendered
        }
      }

      loadCatalog();
    </script>
  </body>
</html>
