<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="55%" stop-color="#cfe8f7" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="truckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="ridgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78716c" />
      <stop offset="50%" stop-color="#57534e" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
    <clipPath id="roundedClip">
      <rect width="512" height="512" rx="108" />
    </clipPath>
  </defs>

  <g clip-path="url(#roundedClip)">
    <!-- Soft Daylight Sky -->
    <rect width="512" height="512" fill="url(#skyGrad)" />

    <!-- Golden Horizon Sun & Compass Ring Motif -->
    <circle cx="352" cy="148" r="82" fill="url(#sunGrad)" opacity="0.92" />
    <circle cx="352" cy="148" r="102" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="10 8" opacity="0.65" />
    <!-- Compass Star Points -->
    <polygon points="352,26 360,46 352,40 344,46" fill="#d97706" />
    <polygon points="352,270 360,250 352,256 344,250" fill="#d97706" />
    <polygon points="230,148 250,140 244,148 250,156" fill="#d97706" />
    <polygon points="474,148 454,140 460,148 454,156" fill="#d97706" />

    <!-- Distant Alpine & Red Canyon Peaks -->
    <polygon points="-20,380 118,176 264,380" fill="#94a3b8" />
    <polygon points="118,176 156,232 126,224 102,244 82,226" fill="#f8fafc" />
    <polygon points="170,390 318,204 470,390" fill="#c86d51" />
    <polygon points="330,390 442,228 540,390" fill="#64748b" />

    <!-- Emerald Pine Valley Silhouette -->
    <polygon points="24,380 54,292 84,380" fill="#15803d" />
    <polygon points="68,380 100,276 132,380" fill="#166534" />
    <polygon points="114,380 140,308 166,380" fill="#15803d" />

    <!-- Waypoint Sky Beacon Pillar -->
    <rect x="424" y="80" width="14" height="210" fill="#fef08a" opacity="0.48" />
    <polygon points="431,64 445,84 417,84" fill="#f59e0b" />

    <!-- Tilted 4x4 Expedition Truck Climbing the Ridge -->
    <g transform="translate(248, 286) rotate(-18)">
      <!-- Suspension Coil Springs -->
      <rect x="-102" y="18" width="16" height="36" rx="4" fill="#eab308" />
      <rect x="78" y="18" width="16" height="36" rx="4" fill="#eab308" />
      <!-- Axle Truss -->
      <rect x="-106" y="34" width="204" height="12" rx="6" fill="#334155" />

      <!-- Truck Lower Body Chassis -->
      <rect x="-138" y="-34" width="268" height="58" rx="14" fill="url(#truckGrad)" stroke="#7c2d12" stroke-width="4" />
      <!-- Truck Upper Cabin -->
      <path d="M-82,-32 L-54,-92 L66,-92 L94,-32 Z" fill="url(#truckGrad)" stroke="#7c2d12" stroke-width="4" stroke-linejoin="round" />
      <!-- Cabin Windows -->
      <path d="M-46,-80 L10,-80 L10,-38 L-68,-38 Z" fill="#1e293b" />
      <path d="M22,-80 L60,-80 L82,-38 L22,-38 Z" fill="#1e293b" />
      <path d="M28,-76 L54,-76 L72,-42 L28,-42 Z" fill="#38bdf8" opacity="0.55" />

      <!-- Expedition Roof Rack & LED Light Bar -->
      <rect x="-56" y="-106" width="124" height="10" rx="5" fill="#1e293b" />
      <circle cx="66" cy="-101" r="7" fill="#fef08a" />
      <!-- Headlight Glow Beam -->
      <polygon points="130,-18 230,-48 230,12" fill="#fef08a" opacity="0.45" />
      <rect x="122" y="-24" width="12" height="18" rx="4" fill="#fef08a" />

      <!-- Raised Desert Snorkel -->
      <path d="M88,-36 L102,-96 L116,-96" fill="none" stroke="#1e293b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Rear Spare Tire -->
      <circle cx="-146" cy="-22" r="28" fill="#1e293b" stroke="#0f172a" stroke-width="4" />
      <circle cx="-146" cy="-22" r="13" fill="#cbd5e1" />

      <!-- Fender Flares -->
      <path d="M-132,24 A52,52 0 0,1 -36,24" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round" />
      <path d="M36,24 A52,52 0 0,1 132,24" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round" />

      <!-- Rear Offroad Wheel -->
      <g transform="translate(-84, 48)">
        <circle r="46" fill="#1e293b" stroke="#0f172a" stroke-width="6" />
        <circle r="36" fill="none" stroke="#475569" stroke-width="5" stroke-dasharray="12 8" />
        <circle r="22" fill="#e2e8f0" stroke="#64748b" stroke-width="4" />
        <circle r="8" fill="#f97316" />
      </g>

      <!-- Front Offroad Wheel -->
      <g transform="translate(84, 48)">
        <circle r="46" fill="#1e293b" stroke="#0f172a" stroke-width="6" />
        <circle r="36" fill="none" stroke="#475569" stroke-width="5" stroke-dasharray="12 8" />
        <circle r="22" fill="#e2e8f0" stroke="#64748b" stroke-width="4" />
        <circle r="8" fill="#f97316" />
      </g>
    </g>

    <!-- Foreground Rocky Mountain Ledge -->
    <polygon points="-20,520 -20,396 142,358 310,304 446,252 532,238 532,520" fill="url(#ridgeGrad)" />
    <polygon points="142,358 310,304 446,252 418,312 256,368" fill="#a8a29e" opacity="0.38" />
  </g>

  <!-- Outer Gloss Border -->
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="8" />
</svg>
