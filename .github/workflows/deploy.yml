name: Deploy Arcade to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build All Registered Games & Assemble Portal Site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp games.json _site/
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            const games = JSON.parse(fs.readFileSync("games.json", "utf8"));
            for (const g of games) {
              console.log("=== Building " + g.id + " ===");
              execSync("npm install --no-audit --no-fund && npm run build", { cwd: g.id, stdio: "inherit" });
              fs.mkdirSync("_site/" + g.id, { recursive: true });
              fs.cpSync(g.id + "/dist", "_site/" + g.id, { recursive: true });
            }
          '

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
