name: Deploy Arcade to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Assemble Static Portal & Pre-Built Game Bundles
        run: |
          mkdir -p _site
          cp index.html _site/
          cp games.json _site/
          cp -f sitemap.xml robots.txt llms.txt _site/ || true
          for dist_dir in */dist; do
            if [ -d "$dist_dir" ]; then
              game_id="${dist_dir%/dist}"
              echo "=== Publishing pre-built bundle: $game_id ==="
              mkdir -p "_site/$game_id"
              cp -r "$dist_dir"/. "_site/$game_id"/
            fi
          done

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
