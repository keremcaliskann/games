name: Deploy Arcade to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build cyber-flap
        run: |
          cd cyber-flap
          npm install
          npm run build
          cd ..

      - name: Build cyber-arrow-3d
        run: |
          cd cyber-arrow-3d
          npm install
          npm run build
          cd ..

      - name: Build color-block-jam-3d
        run: |
          cd color-block-jam-3d
          npm install
          npm run build
          cd ..

      - name: Build screw-jam-3d
        run: |
          cd screw-jam-3d
          npm install
          npm run build
          cd ..

      - name: Assemble Arcade Portal Site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp games.json _site/
          mkdir -p _site/cyber-flap
          cp -r cyber-flap/dist/* _site/cyber-flap/
          mkdir -p _site/cyber-arrow-3d
          cp -r cyber-arrow-3d/dist/* _site/cyber-arrow-3d/
          mkdir -p _site/color-block-jam-3d
          cp -r color-block-jam-3d/dist/* _site/color-block-jam-3d/
          mkdir -p _site/screw-jam-3d
          cp -r screw-jam-3d/dist/* _site/screw-jam-3d/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
