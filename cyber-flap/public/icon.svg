<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Daylight Azure Sky Gradient -->
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Sunlit Radial Flare -->
    <radialGradient id="sun-flare" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Drone Fuselage Golden Shading -->
    <linearGradient id="fuselage-gold-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <linearGradient id="fuselage-gold-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="fuselage-dorsal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fef9c3" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Aerodynamic Cyan Wings -->
    <linearGradient id="wing-cyan-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>

    <linearGradient id="wing-cyan-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <!-- Visor Canopy Gradient -->
    <linearGradient id="canopy-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <!-- Plasma Flame Gradients -->
    <linearGradient id="flame-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="flame-outer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows for 3D Depth -->
    <filter id="drone-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>

    <filter id="halo-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with Cheerful Sky Gradient -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sky-grad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sun-flare)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.4" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Aerodynamic Speed Streamlines -->
  <g opacity="0.35">
    <path d="M 64 160 C 140 180, 200 190, 240 195" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="16 12" />
    <path d="M 448 160 C 372 180, 312 190, 272 195" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="16 12" />
    <path d="M 48 340 C 120 330, 180 320, 220 315" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="12 10" />
    <path d="M 464 340 C 392 330, 332 320, 292 315" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="12 10" />
  </g>

  <!-- Glowing Aero Ring (Behind Drone) -->
  <g transform="rotate(-14 256 250)" filter="url(#halo-glow)">
    <ellipse cx="256" cy="250" rx="186" ry="76" fill="none" stroke="#ffffff" stroke-width="7" stroke-opacity="0.65" />
    <ellipse cx="256" cy="250" rx="186" ry="76" fill="none" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.9" />
    <ellipse cx="256" cy="250" rx="186" ry="76" fill="none" stroke="#facc15" stroke-width="1.5" stroke-dasharray="16 12" />
  </g>

  <!-- Drone Group with Dynamic Contact Shadow -->
  <g filter="url(#drone-shadow)">
    <!-- Plasma Exhaust Thrusters -->
    <!-- Outer Cyan Plumes -->
    <polygon points="234,330 256,462 278,330" fill="url(#flame-outer)" />
    <polygon points="210,324 224,402 234,324" fill="url(#flame-outer)" opacity="0.8" />
    <polygon points="278,324 288,402 302,324" fill="url(#flame-outer)" opacity="0.8" />

    <!-- Core Golden-Orange Plasma Core -->
    <polygon points="242,330 256,440 270,330" fill="url(#flame-core)" />
    <polygon points="249,330 256,396 263,330" fill="#ffffff" />

    <!-- Left Aerodynamic Wing -->
    <g>
      <!-- Wing Surface -->
      <polygon points="214,240 72,316 170,330 216,304" fill="url(#wing-cyan-l)" stroke="#0e7490" stroke-width="1.5" />
      <!-- Wing Coral Trim Leading Edge -->
      <line x1="214" y1="240" x2="72" y2="316" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" />
      <line x1="214" y1="240" x2="72" y2="316" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <!-- Wingtip Marker -->
      <circle cx="72" cy="316" r="4.5" fill="#facc15" />
    </g>

    <!-- Right Aerodynamic Wing -->
    <g>
      <!-- Wing Surface -->
      <polygon points="298,240 440,316 342,330 296,304" fill="url(#wing-cyan-r)" stroke="#0891b2" stroke-width="1.5" />
      <!-- Wing Coral Trim Leading Edge -->
      <line x1="298" y1="240" x2="440" y2="316" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" />
      <line x1="298" y1="240" x2="440" y2="316" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <!-- Wingtip Marker -->
      <circle cx="440" cy="316" r="4.5" fill="#facc15" />
    </g>

    <!-- Fuselage Body (Canary Gold + White Racing Stripes) -->
    <!-- Rear Thruster Ring Assembly -->
    <ellipse cx="256" cy="330" rx="30" ry="11" fill="#ca8a04" stroke="#ffffff" stroke-width="2.5" />

    <!-- Left Fuselage Facet -->
    <polygon points="256,146 194,244 256,322 256,220" fill="url(#fuselage-gold-l)" stroke="#ca8a04" stroke-width="1.5" />

    <!-- Right Fuselage Facet (Sunlit) -->
    <polygon points="256,146 318,244 256,322 256,220" fill="url(#fuselage-gold-r)" stroke="#ca8a04" stroke-width="1.5" />

    <!-- Center White Racing Stripe -->
    <polygon points="256,146 244,220 256,322 268,220" fill="#ffffff" />
    <line x1="256" y1="146" x2="256" y2="322" stroke="#38bdf8" stroke-width="2.5" />

    <!-- Dorsal Nose Plate -->
    <polygon points="256,146 230,214 256,236 282,214" fill="url(#fuselage-dorsal)" stroke="#ca8a04" stroke-width="1" />

    <!-- Visor Canopy Glass -->
    <g>
      <!-- Ambient Visor Glow -->
      <ellipse cx="256" cy="206" rx="44" ry="15" fill="#00f0ff" opacity="0.35" />
      <!-- Deep Blue Visor Plate -->
      <polygon points="226,210 256,215 286,210 282,201 256,198 230,201" fill="url(#canopy-glass)" stroke="#ffffff" stroke-width="2" />
      <!-- Visor Specular Glass Arc -->
      <line x1="234" y1="205" x2="278" y2="205" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Forefront Halo Energy Segment (Passes in front of Fuselage for 3D Layering) -->
  <g transform="rotate(-14 256 250)">
    <path d="M 116 272 A 186 76 0 0 0 396 272" fill="none" stroke="#ffffff" stroke-width="7" stroke-opacity="0.85" />
    <path d="M 116 272 A 186 76 0 0 0 396 272" fill="none" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.95" />
  </g>

  <!-- Nose High-Intensity Spark -->
  <circle cx="256" cy="146" r="5" fill="#ffffff" />
  <circle cx="256" cy="146" r="8" fill="#facc15" opacity="0.6" />
</svg>
