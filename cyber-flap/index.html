<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>CYBER-FLAP // 2099</title>

    <!-- Mobile & PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#05020d" />
    <link rel="manifest" href="./manifest.json" />

    <!-- OpenGraph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CYBER-FLAP // 2099" />
    <meta property="og:description" content="High-octane 3D cyberpunk drone flight runner. Dodge neon obstacles across futuristic cityscapes with precision flight controls." />
    <meta property="og:url" content="https://keremcaliskann.github.io/games/cyber-flap/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CYBER-FLAP // 2099" />
    <meta name="twitter:description" content="High-octane 3D cyberpunk drone flight runner. Dodge neon obstacles across futuristic cityscapes with precision flight controls." />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05020d;
        overscroll-behavior: none;
        font-family: 'Courier New', Courier, monospace;
      }
      #app {
        position: fixed;
        inset: 0;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
