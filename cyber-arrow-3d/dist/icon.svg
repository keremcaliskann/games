<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Indigo-Violet to Vibrant Azure -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="35%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Radial Sunlight Halo -->
    <radialGradient id="sun-halo" cx="65%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>

    <!-- Blazing Golden Arrowhead Gradients -->
    <linearGradient id="arrow-gold-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="45%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="arrow-gold-side" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <linearGradient id="arrow-shaft-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="arrow-shaft-side" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Porcelain / Toy Block Gradients -->
    <linearGradient id="block-porcelain-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="block-porcelain-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="block-porcelain-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Candy Acrylic Mint Block -->
    <linearGradient id="block-mint-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="block-mint-side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Candy Acrylic Coral Block -->
    <linearGradient id="block-coral-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="block-coral-side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Candy Acrylic Cyan Block -->
    <linearGradient id="block-cyan-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="block-cyan-side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-spark" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="12" y="12" width="488" height="488" rx="112" fill="url(#bg-grad)" stroke="#38bdf8" stroke-width="3.5" stroke-opacity="0.4" />
  <rect x="22" y="22" width="468" height="468" rx="102" fill="none" stroke="#facc15" stroke-width="1.2" stroke-opacity="0.2" />

  <!-- Warm Sunburst Flare in Upper Right -->
  <circle cx="340" cy="180" r="170" fill="url(#sun-halo)" />

  <!-- Subtle Isometric Alignment Grid Background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.2">
    <line x1="230" y1="40" x2="230" y2="470" stroke-dasharray="6 6" />
    <line x1="40" y1="160" x2="470" y2="410" stroke-dasharray="8 8" />
    <line x1="40" y1="360" x2="470" y2="110" stroke-dasharray="8 8" />
  </g>

  <!-- 3D Ground Shadow Under Puzzle Platform -->
  <ellipse cx="230" cy="415" rx="150" ry="46" fill="#030712" opacity="0.45" />

  <!-- Left Neighbor Block: Mint Emerald (#10b981) -->
  <g id="neighbor-mint">
    <!-- Top Face -->
    <polygon points="120,295 190,335 120,375 50,335" fill="url(#block-mint-top)" stroke="#34d399" stroke-width="1" />
    <!-- Left Face -->
    <polygon points="50,335 120,375 120,425 50,385" fill="url(#block-mint-side)" />
    <!-- Right Face -->
    <polygon points="120,375 190,335 190,385 120,425" fill="#047857" />
  </g>

  <!-- Right Neighbor Block: Coral Pink (#f43f5e) -->
  <g id="neighbor-coral">
    <!-- Top Face -->
    <polygon points="340,295 410,335 340,375 270,335" fill="url(#block-coral-top)" stroke="#fb7185" stroke-width="1" />
    <!-- Left Face -->
    <polygon points="270,335 340,375 340,425 270,385" fill="#e11d48" />
    <!-- Right Face -->
    <polygon points="340,375 410,335 410,385 340,425" fill="url(#block-coral-side)" />
  </g>

  <!-- Center-Lower Neighbor Block: Sky Cyan (#0284c7) -->
  <g id="neighbor-cyan">
    <!-- Top Face -->
    <polygon points="230,345 300,385 230,425 160,385" fill="url(#block-cyan-top)" stroke="#7dd3fc" stroke-width="1" />
    <!-- Left Face -->
    <polygon points="160,385 230,425 230,460 160,420" fill="#0369a1" />
    <!-- Right Face -->
    <polygon points="230,425 300,385 300,420 230,460" fill="url(#block-cyan-side)" />
  </g>

  <!-- Hero Main Block: Porcelain White / Light Sky Satin Cube -->
  <g id="hero-porcelain-block">
    <!-- Left Face -->
    <polygon points="120,240 230,305 230,405 120,340" fill="url(#block-porcelain-left)" stroke="#94a3b8" stroke-width="1" />
    <!-- Right Face -->
    <polygon points="230,305 340,240 340,340 230,405" fill="url(#block-porcelain-right)" stroke="#64748b" stroke-width="1" />
    <!-- Top Face -->
    <polygon points="230,175 340,240 230,305 120,240" fill="url(#block-porcelain-top)" stroke="#ffffff" stroke-width="1.8" />

    <!-- Top Face Beveled Socket (Escape Origin) -->
    <polygon points="230,215 272,240 230,265 188,240" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
    <polygon points="230,220 262,240 230,260 198,240" fill="#0369a1" />

    <!-- Subtle Cyan Energy Ring on Top Face -->
    <ellipse cx="230" cy="240" rx="72" ry="36" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6 4" />
  </g>

  <!-- Blazing Golden 3D Escape Arrow (Bursting Out Along Upward-Right Trajectory) -->
  <g id="golden-escape-arrow">
    <!-- Motion Trail Streak -->
    <line x1="230" y1="240" x2="410" y2="105" stroke="#facc15" stroke-width="16" stroke-opacity="0.3" stroke-linecap="round" filter="url(#glow-gold)" />

    <!-- 3D Arrow Shaft -->
    <!-- Shaft Lower/Side Face -->
    <polygon points="214,248 240,265 332,192 306,175" fill="url(#arrow-shaft-side)" />
    <!-- Shaft Top Bright Face -->
    <polygon points="214,248 306,175 324,158 232,231" fill="url(#arrow-shaft-top)" stroke="#fde047" stroke-width="1.2" />

    <!-- 3D Faceted Golden Arrowhead (Tip at 414, 102) -->
    <!-- Lower Bevel Facet (Warm Amber Depth) -->
    <polygon points="414,102 324,168 364,226" fill="url(#arrow-gold-side)" stroke="#f59e0b" stroke-width="1" />

    <!-- Upper Bevel Facet (Solar Gold Highlight) -->
    <polygon points="414,102 296,128 324,168" fill="url(#arrow-gold-top)" stroke="#facc15" stroke-width="1.5" filter="url(#glow-gold)" />

    <!-- Center Spine Pure White Specular Flare -->
    <line x1="324" y1="168" x2="414" y2="102" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="324" y1="168" x2="414" y2="102" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" filter="url(#glow-spark)" />

    <!-- Arrowhead Outer Luminous Outlines -->
    <polyline points="296,128 414,102 364,226" fill="none" stroke="#fef08a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="296,128 414,102 364,226" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Arrow Tip Energy Spark -->
    <circle cx="414" cy="102" r="6" fill="#ffffff" filter="url(#glow-spark)" />
  </g>

  <!-- ASMR Multi-Color Confetti & Starburst Sparks -->
  <g id="confetti-sparks">
    <!-- Starburst 1 (Above Tip - Gold) -->
    <g transform="translate(436, 76)" filter="url(#glow-spark)">
      <path d="M 0 -13 Q 0 0 13 0 Q 0 0 0 13 Q 0 0 -13 0 Q 0 0 0 -13 Z" fill="#ffffff" />
      <circle cx="0" cy="0" r="3.5" fill="#facc15" />
    </g>

    <!-- Starburst 2 (Hot Coral Spark) -->
    <g transform="translate(325, 72)" filter="url(#glow-spark)">
      <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" fill="#ffffff" />
      <circle cx="0" cy="0" r="2.5" fill="#f43f5e" />
    </g>

    <!-- Starburst 3 (Electric Cyan Spark) -->
    <g transform="translate(442, 146)" filter="url(#glow-spark)">
      <path d="M 0 -9 Q 0 0 9 0 Q 0 0 0 9 Q 0 0 -9 0 Q 0 0 0 -9 Z" fill="#ffffff" />
      <circle cx="0" cy="0" r="2.5" fill="#38bdf8" />
    </g>

    <!-- Floating Confetti Voxels -->
    <!-- Mint Voxel -->
    <g transform="translate(356, 85) scale(0.7)">
      <polygon points="15,0 30,8 15,16 0,8" fill="#34d399" />
      <polygon points="0,8 15,16 15,30 0,22" fill="#10b981" />
      <polygon points="15,16 30,8 30,22 15,30" fill="#059669" />
    </g>

    <!-- Coral Voxel -->
    <g transform="translate(275, 110) scale(0.65)">
      <polygon points="15,0 30,8 15,16 0,8" fill="#fb7185" />
      <polygon points="0,8 15,16 15,30 0,22" fill="#f43f5e" />
      <polygon points="15,16 30,8 30,22 15,30" fill="#e11d48" />
    </g>

    <!-- Cyan Voxel -->
    <g transform="translate(388, 192) scale(0.75)">
      <polygon points="15,0 30,8 15,16 0,8" fill="#7dd3fc" />
      <polygon points="0,8 15,16 15,30 0,22" fill="#0284c7" />
      <polygon points="15,16 30,8 30,22 15,30" fill="#0369a1" />
    </g>

    <!-- Trailing Spark Embers -->
    <circle cx="368" cy="144" r="3.5" fill="#facc15" filter="url(#glow-spark)" />
    <circle cx="295" cy="184" r="3" fill="#f43f5e" />
    <circle cx="396" cy="158" r="3" fill="#34d399" />
    <circle cx="258" cy="218" r="3.5" fill="#38bdf8" />
    <circle cx="338" cy="120" r="2.5" fill="#ffffff" />
    <circle cx="450" cy="115" r="2" fill="#facc15" />
  </g>
</svg>
