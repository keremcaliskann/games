  overflow: hidden;
}

.ad-mock-creative {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  z-index: 2;
}

.ad-mock-glow {
  position: absolute;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(56, 189, 248, 0.25), transparent);
  top: 20%;
  pointer-events: none;
}

.ad-mock-brand {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 2px;
  margin: 0;
  color: #fff;
}

.ad-mock-desc {
  font-size: 13px;
  color: #94a3b8;
  margin: 0;
  max-width: 220px;
}

.ad-mock-cta {
  margin-top: 10px;
  background: linear-gradient(135deg, #38bdf8, #0284c7);
  color: #fff;
  padding: 12px 28px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 1.5px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(14, 165, 233, 0.4);
}

/* Responsive Layout for Narrow Screens */
@media (max-width: 1024px) {
  .shell-sidebar-right {
    display: none !important;
  }
}

@media (max-width: 768px) {
  #arcade-shell,
  .arcade-shell {
    flex-direction: column;
  }
  .shell-sidebar-left {
    width: 100%;
    min-width: 100%;
    height: auto;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    border-right: none;
    border-bottom: 1px solid rgba(56, 189, 248, 0.2);
  }
  .shell-other-games {
    display: none;
  }
  .shell-nav {
    flex-direction: row;
    gap: 6px;
  }
  .shell-btn {
    padding: 6px 10px;
    font-size: 11px;
  }
}
