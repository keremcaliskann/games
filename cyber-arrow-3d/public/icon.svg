<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bg-arrow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#12172e" />
      <stop offset="60%" stop-color="#0a0e1c" />
      <stop offset="100%" stop-color="#070914" />
    </radialGradient>

    <!-- Neon Glow Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" opacity="0.6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-arrow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" opacity="0.7" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-magenta" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" opacity="0.6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-lime" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" opacity="0.6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cube Face Gradients -->
    <linearGradient id="cube-top-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28395e" />
      <stop offset="60%" stop-color="#1e2942" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>

    <linearGradient id="cube-left-grad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1c263e" />
      <stop offset="100%" stop-color="#141b2d" />
    </linearGradient>

    <linearGradient id="cube-right-grad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#101726" />
      <stop offset="100%" stop-color="#0b101c" />
    </linearGradient>

    <!-- Arrow 3D Gradients -->
    <linearGradient id="arrow-upper-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="40%" stop-color="#70f8ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="arrow-lower-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077b6" />
      <stop offset="60%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <linearGradient id="arrow-shaft-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c8e0" />
      <stop offset="100%" stop-color="#e0ffff" />
    </linearGradient>

    <linearGradient id="arrow-shaft-side" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0077a8" />
      <stop offset="100%" stop-color="#004466" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="12" y="12" width="488" height="488" rx="112" fill="url(#bg-arrow)" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.35" />
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.12" />

  <!-- Isometric Circuit Background Grid -->
  <g opacity="0.16">
    <!-- Grid Rays & Isometric Lines -->
    <line x1="230" y1="30" x2="230" y2="480" stroke="#00f0ff" stroke-width="1" stroke-dasharray="6 6" />
    <line x1="30" y1="190" x2="480" y2="450" stroke="#00f0ff" stroke-width="1" stroke-dasharray="8 8" />
    <line x1="30" y1="350" x2="480" y2="90" stroke="#00f0ff" stroke-width="1" stroke-dasharray="8 8" />

    <line x1="120" y1="80" x2="120" y2="440" stroke="#00f0ff" stroke-width="1" opacity="0.5" />
    <line x1="340" y1="80" x2="340" y2="440" stroke="#00f0ff" stroke-width="1" opacity="0.5" />

    <!-- Circuit Trace Lines & Nodes -->
    <path d="M 60 120 L 110 150 L 110 200" fill="none" stroke="#00f0ff" stroke-width="1.5" />
    <circle cx="60" cy="120" r="3" fill="#00f0ff" />
    <circle cx="110" cy="200" r="3" fill="#00f0ff" />

    <path d="M 450 360 L 400 330 L 400 280" fill="none" stroke="#00f0ff" stroke-width="1.5" />
    <circle cx="450" cy="360" r="3" fill="#00f0ff" />
    <circle cx="400" cy="280" r="3" fill="#00f0ff" />

    <!-- Corner Alignment Marks -->
    <path d="M 48 80 L 48 48 L 80 48" fill="none" stroke="#00f0ff" stroke-width="2" />
    <path d="M 464 80 L 464 48 L 432 48" fill="none" stroke="#00f0ff" stroke-width="2" />
    <path d="M 48 432 L 48 464 L 80 464" fill="none" stroke="#00f0ff" stroke-width="2" />
    <path d="M 464 432 L 464 464 L 432 464" fill="none" stroke="#00f0ff" stroke-width="2" />
  </g>

  <!-- HUD Telemetry Labels -->
  <text x="56" y="78" fill="#00f0ff" opacity="0.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2">3D SPATIAL</text>
  <text x="370" y="78" fill="#00f0ff" opacity="0.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2">ASMR//ESC</text>
  <text x="56" y="446" fill="#39ff14" opacity="0.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">CLEAR: READY</text>
  <text x="360" y="446" fill="#ff0077" opacity="0.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">VECT: +X+Y</text>

  <!-- Isometric 3D Puzzle Cube Base -->
  <g id="cube-base">
    <!-- Left Face (#141b2d) -->
    <polygon points="120,243 230,306 230,420 120,357" fill="url(#cube-left-grad)" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.35" />
    <!-- Left Face Tech Grooves -->
    <line x1="140" y1="264" x2="140" y2="352" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.25" />
    <line x1="175" y1="290" x2="210" y2="310" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="175" cy="290" r="2.5" fill="#00f0ff" opacity="0.5" />

    <!-- Right Face (#0b101c) -->
    <polygon points="230,306 340,243 340,357 230,420" fill="url(#cube-right-grad)" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.25" />
    <!-- Right Face Tech Grooves -->
    <line x1="320" y1="264" x2="320" y2="352" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.2" />
    <line x1="285" y1="290" x2="250" y2="310" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.25" />
    <circle cx="285" cy="290" r="2.5" fill="#00f0ff" opacity="0.4" />

    <!-- Top Face (#1e2942) -->
    <polygon points="230,180 340,243 230,306 120,243" fill="url(#cube-top-grad)" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.5" />

    <!-- Top Face Bevel Inset -->
    <polygon points="230,192 324,243 230,294 136,243" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.2" />

    <!-- Isometric Aperture Socket (Where Arrow Emerges) -->
    <polygon points="230,222 268,243 230,264 192,243" fill="#090d16" stroke="#00f0ff" stroke-width="1.5" />
    <polygon points="230,226 260,243 230,260 200,243" fill="#00f0ff" opacity="0.35" filter="url(#glow-cyan)" />

    <!-- Shockwave Energy Ripples on Top Face -->
    <ellipse cx="230" cy="243" rx="65" ry="32" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="8 6" filter="url(#glow-cyan)" />
    <ellipse cx="230" cy="243" rx="88" ry="44" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="5 5" />

    <!-- Cube Glowing Edge Accents -->
    <!-- Top-Left Crest -->
    <line x1="120" y1="243" x2="230" y2="180" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.75" filter="url(#glow-cyan)" />
    <!-- Center Vertical Seam -->
    <line x1="230" y1="306" x2="230" y2="420" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.6" filter="url(#glow-cyan)" />
    <line x1="230" y1="306" x2="230" y2="420" stroke="#ffffff" stroke-width="1" stroke-opacity="0.8" />
  </g>

  <!-- Blazing Neon 3D Escape Arrow Bursting Out Along Upward-Right Trajectory -->
  <g id="escape-arrow">
    <!-- Arrow Trajectory Wake Glow -->
    <line x1="230" y1="243" x2="400" y2="105" stroke="#00f0ff" stroke-width="16" stroke-opacity="0.25" stroke-linecap="round" filter="url(#glow-arrow)" />

    <!-- 3D Arrow Shaft -->
    <!-- Shaft Lower / Side Face -->
    <polygon points="214,248 238,266 328,190 304,172" fill="url(#arrow-shaft-side)" stroke="#0077b6" stroke-width="1" />
    <!-- Shaft Top Bright Face -->
    <polygon points="214,248 304,172 322,156 232,232" fill="url(#arrow-shaft-top)" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-cyan)" />

    <!-- 3D Faceted Arrowhead (Pointing Upward-Right to 404, 102) -->
    <!-- Lower Bevel Facet (Depth & Contrast) -->
    <polygon points="404,102 320,166 358,222" fill="url(#arrow-lower-grad)" stroke="#00f0ff" stroke-width="1.5" />

    <!-- Upper Bevel Facet (Bright Specular Flare) -->
    <polygon points="404,102 292,126 320,166" fill="url(#arrow-upper-grad)" stroke="#00f0ff" stroke-width="2" filter="url(#glow-cyan)" />

    <!-- Center Spine Core Highlight -->
    <line x1="320" y1="166" x2="404" y2="102" stroke="#ffffff" stroke-width="3" stroke-linecap="round" filter="url(#glow-cyan)" />
    <line x1="320" y1="166" x2="404" y2="102" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

    <!-- Arrowhead Outer Glowing Neon Outlines -->
    <polyline points="292,126 404,102 358,222" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-arrow)" />
    <polyline points="292,126 404,102 358,222" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Arrow Tip Energy Spark -->
    <circle cx="404" cy="102" r="5" fill="#ffffff" filter="url(#glow-arrow)" />
  </g>

  <!-- ASMR Escape Particles & Sparks (#ff0077, #39ff14, #00f0ff) -->
  <g id="asmr-particles">
    <!-- Floating Mini Isometric Voxels (Dissolving Blocks) -->
    <!-- Voxel 1: Lime Green (#39ff14) -->
    <g transform="translate(348, 80) scale(0.65)" filter="url(#glow-lime)">
      <polygon points="15,0 30,8 15,16 0,8" fill="#5cff3d" />
      <polygon points="0,8 15,16 15,30 0,22" fill="#2eb814" />
      <polygon points="15,16 30,8 30,22 15,30" fill="#1b6e0c" />
    </g>

    <!-- Voxel 2: Hot Magenta (#ff0077) -->
    <g transform="translate(268, 105) scale(0.6)" filter="url(#glow-magenta)">
      <polygon points="15,0 30,8 15,16 0,8" fill="#ff4d9e" />
      <polygon points="0,8 15,16 15,30 0,22" fill="#d60064" />
      <polygon points="15,16 30,8 30,22 15,30" fill="#80003c" />
    </g>

    <!-- Voxel 3: Electric Cyan (#00f0ff) -->
    <g transform="translate(378, 185) scale(0.7)" filter="url(#glow-cyan)">
      <polygon points="15,0 30,8 15,16 0,8" fill="#80f8ff" />
      <polygon points="0,8 15,16 15,30 0,22" fill="#00b4d8" />
      <polygon points="15,16 30,8 30,22 15,30" fill="#007799" />
    </g>

    <!-- Voxel 4: Mini Lime Accent -->
    <g transform="translate(170, 210) scale(0.45)" filter="url(#glow-lime)">
      <polygon points="15,0 30,8 15,16 0,8" fill="#5cff3d" />
      <polygon points="0,8 15,16 15,30 0,22" fill="#2eb814" />
      <polygon points="15,16 30,8 30,22 15,30" fill="#1b6e0c" />
    </g>

    <!-- Sparkling ASMR Energy Starbursts -->
    <!-- Starburst 1 (Above Tip) -->
    <g transform="translate(426, 75)" filter="url(#glow-cyan)">
      <path d="M 0 -12 Q 0 0 12 0 Q 0 0 0 12 Q 0 0 -12 0 Q 0 0 0 -12 Z" fill="#ffffff" />
      <circle cx="0" cy="0" r="3" fill="#00f0ff" />
    </g>

    <!-- Starburst 2 (Magenta Spark) -->
    <g transform="translate(315, 68)" filter="url(#glow-magenta)">
      <path d="M 0 -9 Q 0 0 9 0 Q 0 0 0 9 Q 0 0 -9 0 Q 0 0 0 -9 Z" fill="#ffffff" />
      <circle cx="0" cy="0" r="2" fill="#ff0077" />
    </g>

    <!-- Starburst 3 (Lime Spark) -->
    <g transform="translate(434, 142)" filter="url(#glow-lime)">
      <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8 Z" fill="#ffffff" />
      <circle cx="0" cy="0" r="2" fill="#39ff14" />
    </g>

    <!-- Trailing Spark Embers -->
    <circle cx="360" cy="140" r="3" fill="#ffffff" filter="url(#glow-cyan)" />
    <circle cx="288" cy="180" r="2.5" fill="#ff0077" filter="url(#glow-magenta)" />
    <circle cx="388" cy="155" r="2.5" fill="#39ff14" filter="url(#glow-lime)" />
    <circle cx="250" cy="215" r="3" fill="#00f0ff" filter="url(#glow-cyan)" />
    <circle cx="330" cy="115" r="2" fill="#ffffff" />
  </g>
</svg>
