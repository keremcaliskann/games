<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="skyGrad" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="60%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="80%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="acrylicGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="metalShaft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d1d5db" />
      <stop offset="50%" stop-color="#f3f4f6" />
      <stop offset="100%" stop-color="#9ca3af" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#a16207" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#skyGrad)" />

  <!-- Warm biscuit base platform glow -->
  <ellipse cx="256" cy="400" rx="170" ry="45" fill="#fcf8ee" opacity="0.9" filter="url(#softShadow)" />

  <!-- Translucent acrylic puzzle plate with hole -->
  <g filter="url(#softShadow)">
    <path d="M 120 180 C 120 150 150 120 180 120 L 360 150 C 390 155 410 185 405 215 L 375 350 C 370 380 340 400 310 395 L 150 360 C 120 355 105 325 110 295 Z" fill="url(#acrylicGrad)" stroke="#ffffff" stroke-width="6" opacity="0.9" />
    <!-- Empty bolt hole -->
    <circle cx="330" cy="230" r="32" fill="#0369a1" opacity="0.35" stroke="#ffffff" stroke-width="4" />
  </g>

  <!-- Golden 3D Screw / Bolt -->
  <g filter="url(#boltGlow)">
    <!-- Threaded shaft descending into hole -->
    <rect x="236" y="250" width="40" height="90" rx="10" fill="url(#metalShaft)" />
    <!-- Thread ridges -->
    <path d="M 234 275 L 278 285" stroke="#9ca3af" stroke-width="6" stroke-linecap="round" />
    <path d="M 234 295 L 278 305" stroke="#9ca3af" stroke-width="6" stroke-linecap="round" />
    <path d="M 234 315 L 278 325" stroke="#9ca3af" stroke-width="6" stroke-linecap="round" />

    <!-- Hex bolt head -->
    <ellipse cx="256" cy="220" rx="72" ry="46" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="5" />
    
    <!-- Phillips cross slot -->
    <rect x="246" y="195" width="20" height="50" rx="6" fill="#713f12" />
    <rect x="231" y="210" width="50" height="20" rx="6" fill="#713f12" />
    <circle cx="256" cy="220" r="8" fill="#451a03" />

    <!-- Specular highlight -->
    <ellipse cx="230" cy="205" rx="20" ry="10" fill="#ffffff" opacity="0.6" transform="rotate(-20 230 205)" />
  </g>

  <!-- Floating Sparkles / ASMR Stars -->
  <path d="M 390 120 L 396 135 L 411 141 L 396 147 L 390 162 L 384 147 L 369 141 L 384 135 Z" fill="#fef08a" />
  <path d="M 120 250 L 124 260 L 134 264 L 124 268 L 120 278 L 116 268 L 106 264 L 116 260 Z" fill="#ffffff" />
</svg>
