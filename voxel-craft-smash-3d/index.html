    <style>
      :root {
        --color-primary: #0284c7;
        --color-accent: #38bdf8;
        --color-green: #22c55e;
        --color-tnt: #ef4444;
        --color-gold: #f59e0b;
        --bg-stage: #cfe8f7;
      }
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg-stage);
        overscroll-behavior: none;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #0f172a;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }

      /* Dual-Mode Shell: Auto-collapse sidebars in YouTube Playables & external portals */
      body.embed-fullscreen-mode .shell-sidebar-left,
      body.embed-fullscreen-mode .shell-sidebar-right,
      body.embed-fullscreen-mode .fullscreen-ad-banner {
        display: none !important;
      }
      body.embed-fullscreen-mode .arcade-shell {
        grid-template-columns: 1fr !important;
      }

      /* 3-Column Desktop Arcade Shell */
      .arcade-shell {
        display: grid;
        grid-template-columns: 260px 1fr 320px;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: #0b0f19;
      }

      /* Left Navigation Rail */
      .shell-sidebar-left {
        width: 260px;
        background: rgba(15, 23, 42, 0.95);
        border-right: 1px solid rgba(56, 189, 248, 0.25);
        display: flex;
        flex-direction: column;
        padding: 18px 14px;
        gap: 16px;
        overflow-y: auto;
        z-index: 20;
      }
      .shell-brand-link {
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
      }
      .shell-brand-badge {
        background: linear-gradient(135deg, var(--color-primary), var(--color-green));
        color: #fff;
        font-weight: 900;
        font-size: 11px;
        letter-spacing: 1.5px;
        padding: 4px 8px;
        border-radius: 6px;
      }
      .shell-brand-title {
        color: #f8fafc;
        font-weight: 800;
        font-size: 14px;
        letter-spacing: 1px;
      }
      .shell-nav {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .shell-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        color: #cbd5e1;
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.15);
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .shell-btn:hover {
        background: rgba(2, 132, 199, 0.15);
        color: #fff;
        border-color: var(--color-primary);
      }
      .shell-section-title {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1.2px;
        color: #64748b;
        text-transform: uppercase;
        margin: 8px 0 6px 4px;
      }
      .other-games-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .shell-game-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        background: rgba(30, 41, 59, 0.5);
        border: 1px solid rgba(148, 163, 184, 0.1);
        border-radius: 8px;
        text-decoration: none;
        color: #e2e8f0;
      }
      .shell-game-card:hover {
        background: rgba(2, 132, 199, 0.12);
        border-color: rgba(2, 132, 199, 0.3);
      }
      .shell-game-card .game-icon {
        font-size: 18px;
      }
      .shell-game-card .game-title {
        font-size: 12px;
        font-weight: 700;
        display: block;
      }
      .shell-game-card .game-tag {
        font-size: 10px;
        color: #94a3b8;
      }

      /* Center Stage */
      .shell-stage {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--bg-stage);
        overflow: hidden;
      }
      .game-canvas-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .game-hud-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      /* Right Ad Rail */
      .shell-sidebar-right {
        width: 320px;
        background: rgba(15, 23, 42, 0.95);
        border-left: 1px solid rgba(56, 189, 248, 0.25);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px 10px;
        z-index: 20;
      }
      .ad-rail-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .ad-header-tag {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.5px;
        color: #64748b;
      }
      .ad-banner-slot {
        width: 300px;
        height: 600px;
        background: linear-gradient(180deg, #1e293b, #0f172a);
        border: 1px solid rgba(56, 189, 248, 0.25);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        position: relative;
        overflow: hidden;
      }
      .ad-mock-creative {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        z-index: 2;
      }
      .ad-mock-brand {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 2px;
        margin: 0;
        color: #fff;
      }
      .ad-mock-desc {
        font-size: 13px;
        color: #94a3b8;
        margin: 0;
        max-width: 220px;
      }
      .ad-mock-cta {
        margin-top: 10px;
        background: linear-gradient(135deg, var(--color-primary), var(--color-green));
        color: #fff;
        padding: 12px 28px;
        border-radius: 30px;
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 1px;
      }

      /* Fullscreen Sticky Banner */
      .fullscreen-ad-banner {
        display: none;
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 50px;
        background: rgba(15, 23, 42, 0.95);
        border-top: 1px solid rgba(56, 189, 248, 0.3);
        z-index: 40;
        align-items: center;
        justify-content: center;
      }
      :fullscreen .fullscreen-ad-banner {
        display: flex;
      }
      .fullscreen-ad-content {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #fff;
      }
      .ad-tag {
        background: var(--color-primary);
        color: #000;
        font-size: 10px;
        font-weight: 800;
        padding: 3px 6px;
        border-radius: 4px;
      }
      .ad-placeholder-text {
        font-size: 12px;
        font-weight: 600;
        color: #94a3b8;
      }

      /* Responsive Collapse for Small Screens */
      @media (max-width: 900px) {
        .arcade-shell {
          grid-template-columns: 1fr;
        }
        .shell-sidebar-left,
        .shell-sidebar-right {
          display: none;
        }
      }
