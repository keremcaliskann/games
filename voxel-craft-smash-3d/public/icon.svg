<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#f5eedb" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="tntGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="turretGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#skyGrad)" />

  <!-- Floating Voxel Grass Island -->
  <path d="M48 370 L256 460 L464 370 L464 330 L256 420 L48 330 Z" fill="#78350f" />
  <path d="M48 330 L256 420 L464 330 L256 240 Z" fill="url(#grassGrad)" filter="url(#dropShadow)" />

  <!-- 3D Voxel Fortress Tower (Isometric Cubes) -->
  <!-- Central Stone Tower Base -->
  <g transform="translate(256, 170)">
    <!-- Tower Body (Layered Isometric Voxels) -->
    <path d="M-60 40 L0 75 L60 40 L60 -70 L0 -105 L-60 -70 Z" fill="#64748b" />
    <path d="M0 75 L60 40 L60 -70 L0 -35 Z" fill="#475569" />
    <path d="M-60 -70 L0 -35 L0 75 L-60 40 Z" fill="#94a3b8" />
    <path d="M-60 -70 L0 -105 L60 -70 L0 -35 Z" fill="#cbd5e1" />

    <!-- Red TNT Core Block (Embedded) -->
    <g transform="translate(0, 10)">
      <path d="M-28 18 L0 34 L28 18 L28 -18 L0 -34 L-28 -18 Z" fill="url(#tntGrad)" />
      <path d="M0 34 L28 18 L28 -18 L0 -2 Z" fill="#991b1b" />
      <path d="M-28 -18 L0 -2 L0 34 L-28 18 Z" fill="#ef4444" />
      <text x="0" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="12" text-anchor="middle">TNT</text>
    </g>

    <!-- Shattered Exploding Ore Blocks (Flying Out) -->
    <!-- Gold Ore Cube -->
    <g transform="translate(85, -50) rotate(25)">
      <path d="M-16 10 L0 19 L16 10 L16 -10 L0 -19 L-16 -10 Z" fill="url(#goldGrad)" />
      <path d="M0 19 L16 10 L16 -10 L0 -1 Z" fill="#a16207" />
      <path d="M-16 -10 L0 -1 L0 19 L-16 10 Z" fill="#facc15" />
    </g>

    <!-- Diamond Ore Cube -->
    <g transform="translate(-85, -20) rotate(-35)">
      <path d="M-14 9 L0 17 L14 9 L14 -9 L0 -17 L-14 -9 Z" fill="#38bdf8" />
      <path d="M0 17 L14 9 L14 -9 L0 -1 Z" fill="#0284c7" />
      <path d="M-14 -9 L0 -1 L0 17 L-14 9 Z" fill="#7dd3fc" />
    </g>

    <!-- Stone Fragment Cube -->
    <g transform="translate(65, 60) rotate(45)">
      <path d="M-12 8 L0 15 L12 8 L12 -8 L0 -15 L-12 -8 Z" fill="#94a3b8" />
      <path d="M0 15 L12 8 L12 -8 L0 -1 Z" fill="#475569" />
      <path d="M-12 -8 L0 -1 L0 15 L-12 8 Z" fill="#cbd5e1" />
    </g>
  </g>

  <!-- Turret Cannon (Bottom Center firing upwards) -->
  <g transform="translate(256, 390)">
    <!-- Turret Base Plate -->
    <ellipse cx="0" cy="18" rx="44" ry="20" fill="#0f172a" />
    <path d="M-36 10 L36 10 L28 -12 L-28 -12 Z" fill="url(#turretGrad)" />
    <!-- Dual Cannon Barrels -->
    <rect x="-16" y="-55" width="10" height="48" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <rect x="6" y="-55" width="10" height="48" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <!-- Muzzle Flash Sparks -->
    <circle cx="-11" cy="-62" r="8" fill="#facc15" opacity="0.9" />
    <circle cx="11" cy="-62" r="8" fill="#facc15" opacity="0.9" />
    <line x1="-11" y1="-65" x2="-11" y2="-120" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10 6" />
    <line x1="11" y1="-65" x2="11" y2="-120" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10 6" />
  </g>

  <!-- Title Badge Top Header -->
  <g transform="translate(256, 75)">
    <rect x="-170" y="-34" width="340" height="68" rx="34" fill="#0f172a" stroke="#38bdf8" stroke-width="5" />
    <text x="0" y="10" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="900" font-size="28" text-anchor="middle" letter-spacing="2">
      VOXEL SMASH 3D
    </text>
  </g>
</svg>
