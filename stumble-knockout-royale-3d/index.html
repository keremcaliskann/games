        width: 100%;

    min-width: 100% !important;
    max-width: 100% !important;
    height: auto !important;
    flex-direction: row !important;
    align-items: center !important;
    justify-content: space-between !important;
    padding: 8px 12px !important;
    border-right: none !important;
    border-bottom: 1px solid rgba(56, 189, 248, 0.2) !important;
  }
  .shell-other-games {
    display: none !important;
  }
  .shell-nav {
    flex-direction: row !important;
    gap: 6px !important;
  }
  .shell-btn {
    padding: 6px 10px !important;
    font-size: 11px !important;
  }
  .shell-start-card {
    padding: 22px 18px 20px;
    max-width: 340px;
  }
  .shell-start-title {
    font-size: 22px;
  }
}

    </style>
  </head>
  <body>
    <div id="arcade-shell" class="arcade-shell">
                                                                  <!-- Left Navigation Rail -->
      <aside class="shell-sidebar shell-sidebar-left">
        <div class="shell-brand">
          <a href="../" class="shell-brand-link">
            <span class="shell-brand-badge">ARCADE</span>
            <span class="shell-brand-title">3D GAMES</span>
          </a>
        </div>

        <nav class="shell-nav">
          <a href="../" class="shell-btn shell-btn-portal" title="Return to Central Arcade Portal">
            <span class="btn-icon">←</span> Portala Dön
          </a>
          <button id="shell-menu-btn" class="shell-btn shell-btn-menu" type="button">
            <span class="btn-icon">🏠</span> Başlangıç Menüsü
          </button>
          <button id="shell-restart-btn" class="shell-btn shell-btn-restart" type="button">
            <span class="btn-icon">🔄</span> Yeniden Başlat
          </button>
        </nav>

        <section class="shell-other-games">
          <h3 class="shell-section-title">Diğer Oyunlar</h3>
          <div id="shell-other-games-list" class="other-games-list">
            <!-- Hydrated dynamically from ../games.json -->
          </div>
        </section>
      </aside>

      <!-- Center Game Stage -->
      <main id="shell-stage" class="shell-stage">
        <div id="app"></div>

        <div id="hud">
          <div>
            <header class="hud-header">
              <div class="hud-stat-pill">
                <span id="round-title">ROUND 1/3</span>
              </div>
              <div class="hud-stat-pill">
                <span>👑</span>
                <span id="crown-count">0</span>
                <span>| 🪙</span>
                <span id="coin-count">150</span>
              </div>
              <button id="garage-btn" class="hud-garage-btn" data-hud-interactive="true">
                👕 GARAGE &amp; UPGRADES
              </button>
              <div class="hud-btn-group">
                <button id="sound-btn" class="hud-btn" data-hud-interactive="true">🔊</button>
                <button id="restart-btn" class="hud-btn" data-hud-interactive="true">🔄</button>
              </div>
            </header>

            <div class="top-sub-row">
              <div class="qualify-banner">
                <span id="qualify-label">🏁 QUALIFIED: 0 / 8</span>
                <span>|</span>
                <span id="rank-label">🏃 POS: #1/16</span>
              </div>

              <div id="leaderboard-panel" class="leaderboard-panel">
                <!-- Populated dynamically -->
              </div>
            </div>
          </div>

          <div class="bottom-controls-wrap">
            <div class="jump-action-row">
              <button id="jump-dive-btn" class="jump-dive-btn" data-hud-interactive="true">
                <span>🦘</span>
                <span>JUMP</span>
              </button>
            </div>

            <footer class="booster-bar">
              <button id="booster-jetpack" class="booster-btn" data-hud-interactive="true" data-ad-hook="booster">
                <span>🚀</span>
                <span>JETPACK</span>
                <span class="booster-ad-badge">🎬 FREE</span>
              </button>
              <button id="booster-giant" class="booster-btn" data-hud-interactive="true" data-ad-hook="booster">
                <span>🛡️</span>
                <span>TITAN MODE</span>
                <span class="booster-ad-badge">🎬 FREE</span>
              </button>
              <button id="booster-speed" class="booster-btn" data-hud-interactive="true" data-ad-hook="booster">
                <span>⚡</span>
                <span>DASH BOOTS</span>
                <span class="booster-ad-badge">🎬 FREE</span>
              </button>
            </footer>
          </div>
        </div>
      </main>

                                                                  <!-- Right Advertising Rail -->
      <aside class="shell-sidebar shell-sidebar-right">
        <div class="ad-rail-wrapper">
          <span class="ad-header-tag">SPONSOR // REKLAM</span>
          <div id="ad-banner-desktop" class="ad-banner-slot banner-300x600">
            <div class="ad-mock-creative">
              <div class="ad-mock-glow"></div>
              <p class="ad-mock-brand">PARTY KNOCKOUT 3D</p>
              <p class="ad-mock-desc">Zero-install 60 FPS WebGL 3D Arcade</p>
              <div class="ad-mock-cta">ŞİMDİ OYNA</div>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
