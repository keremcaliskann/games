<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="brickBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="brickGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="runnerRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <circle cx="256" cy="240" r="185" fill="#ffffff" opacity="0.14" />

  <!-- Ascending 3D Stair Bridge -->
  <g stroke="#0f172a" stroke-width="10" stroke-linejoin="round">
    <rect x="76" y="376" width="130" height="36" rx="10" fill="url(#brickBlue)" />
    <rect x="132" y="330" width="130" height="36" rx="10" fill="url(#brickBlue)" />
    <rect x="188" y="284" width="130" height="36" rx="10" fill="url(#brickGold)" />
    <rect x="244" y="238" width="130" height="36" rx="10" fill="url(#brickGold)" />
    <rect x="300" y="192" width="136" height="36" rx="10" fill="url(#brickGold)" />
  </g>

  <!-- Runner with Towering Brick Stack on Back -->
  <g stroke="#0f172a" stroke-width="10" stroke-linejoin="round">
    <!-- Backpack Brick Tower -->
    <rect x="108" y="218" width="66" height="24" rx="6" fill="url(#brickGold)" transform="rotate(-12 141 230)" />
    <rect x="102" y="188" width="66" height="24" rx="6" fill="url(#brickGold)" transform="rotate(-12 135 200)" />
    <rect x="96" y="158" width="66" height="24" rx="6" fill="url(#brickGold)" transform="rotate(-12 129 170)" />
    <rect x="90" y="128" width="66" height="24" rx="6" fill="url(#brickGold)" transform="rotate(-12 123 140)" />
    <rect x="84" y="98" width="66" height="24" rx="6" fill="url(#brickGold)" transform="rotate(-12 117 110)" />

    <!-- Runner Character -->
    <rect x="182" y="176" width="68" height="86" rx="34" fill="url(#runnerRed)" transform="rotate(14 216 219)" />
    <circle cx="230" cy="142" r="32" fill="url(#runnerRed)" />
    <rect x="222" y="130" width="32" height="18" rx="9" fill="#f8fafc" />
  </g>

  <!-- Floating Trophy Crown at Top of Stairs -->
  <path d="M350 156 L362 104 L388 130 L412 94 L436 130 L462 104 L474 156 Z" fill="url(#brickGold)" stroke="#0f172a" stroke-width="10" stroke-linejoin="round" />
</svg>
