/* Automatic Disabled State When Ads Are Unavailable (Offline / AdBlocker / No Inventory) */

body.ads-unavailable .hud-booster-btn,

  pointer-events: none !important;

.arcade-shell {
  display: flex !important;
  flex-direction: row !important;
  width: 100vw !important;

}

.shell-brand {

}

.shell-brand-link {

/* Explicitly hide any legacy fullscreen button or banner */

.other-game-tag {

/* Center Game Stage — 100% Isolated Viewport Container for the Game (#app + #hud) */
#shell-stage,
.shell-stage {
  flex: 1 1 auto !important;
  min-width: 0 !important;
  width: auto !important;
  height: 100% !important;
  position: relative !important;
  overflow: hidden !important;
  background: #cfe8f7;
  display: flex !important;
  flex-direction: column !important;
  /* CSS containment + transform traps any position:fixed modals/HUD strictly inside the game stage */
  transform: translateZ(0);
  contain: layout paint;
}

#app,
#game-container,
.game-canvas-container {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  touch-action: none;
  z-index: 1;
}

#app canvas,
#game-container canvas,
.game-canvas-container canvas {
  display: block;
  width: 100% !important;
  height: 100% !important;
}

#hud,
#hud-root,
.game-hud-overlay {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  pointer-events: none;
  z-index: 20;
  overflow: hidden;
  transition: opacity 0.25s ease;
}

#shell-stage.is-menu-locked > *:not(#shell-start-menu),
#shell-stage.is-menu-locked #app,
#shell-stage.is-menu-locked #game-container,
#shell-stage.is-menu-locked .game-canvas-container,
#shell-stage.is-menu-locked #hud,
#shell-stage.is-menu-locked #hud-root,
#shell-stage.is-menu-locked .game-hud-overlay {
  visibility: hidden !important;
  opacity: 0 !important;
  pointer-events: none !important;
}

/* Top-Right Minimal Pause Trigger inside Stage (visible during active gameplay) */
.shell-stage-pause-btn {
  position: absolute !important;
  top: 14px !important;
  right: 14px !important;
  z-index: 88 !important;
  width: 40px !important;
  height: 40px !important;
  border-radius: 12px !important;
  border: 1.5px solid rgba(255, 255, 255, 0.75) !important;
  background: rgba(15, 23, 42, 0.55) !important;
  backdrop-filter: blur(8px) !important;
  -webkit-backdrop-filter: blur(8px) !important;
  color: #ffffff !important;
  font-size: 15px !important;
  font-weight: 900 !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  cursor: pointer !important;
  pointer-events: auto !important;
  box-shadow: 0 6px 16px rgba(15, 23, 42, 0.28) !important;
  transition: transform 0.14s ease, background 0.14s ease, opacity 0.2s ease !important;
}

.shell-stage-pause-btn:hover {
  transform: scale(1.06) !important;
  background: rgba(15, 23, 42, 0.78) !important;
}

#shell-stage.is-menu-locked .shell-stage-pause-btn {
  opacity: 0 !important;
  pointer-events: none !important;
}

/* ==========================================================================
   MINIMALIST THEME-MATCHED START MENU OVERLAY (#shell-start-menu)
   ========================================================================== */
#shell-stage {
  --menu-theme-color: #2563eb;
  --menu-accent-gradient: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
  --menu-glow-rgba: rgba(37, 99, 235, 0.34);
  --menu-tint-bg: rgba(224, 242, 254, 0.85);
}

.shell-start-menu-overlay {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  z-index: 9999 !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  padding: 24px !important;
  /* 100% Opaque Full-Stage Cover — zero background game visibility before Play is clicked */
  background:
    radial-gradient(circle at 50% 22%, var(--menu-glow-rgba) 0%, transparent 58%),
    linear-gradient(160deg, #f8fafc 0%, var(--menu-tint-bg, #e0f2fe) 52%, #e2e8f0 100%) !important;
  pointer-events: auto !important;
  opacity: 1 !important;
  visibility: visible !important;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
  transition: opacity 0.28s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.28s ease !important;
}

.shell-start-menu-overlay.is-hidden {
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}

.shell-start-card {
  position: relative;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(248, 250, 252, 0.94) 100%);
  border: 2.5px solid rgba(255, 255, 255, 0.95);
  border-radius: 28px;
  padding: 30px 26px 26px;
  max-width: 360px;
  width: 100%;
  text-align: center;
  color: #0f172a;
  box-shadow:
    0 24px 55px rgba(15, 23, 42, 0.34),
    0 0 0 1px rgba(148, 163, 184, 0.22),
    0 12px 32px var(--menu-glow-rgba),
    inset 0 2px 0 #ffffff;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  overflow: hidden;
  transform: scale(1) translateY(0);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.shell-start-menu-overlay.is-hidden .shell-start-card {
  transform: scale(0.92) translateY(10px);
}

.shell-start-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 6px;
  background: var(--menu-accent-gradient);
}

/* Optional Minimal Quick Icons (Top-Right of Card: Sound / Reset) */
.shell-start-mini-tools {
  position: absolute;
  top: 16px;
  right: 16px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.shell-mini-icon-btn {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  border: 1px solid #e2e8f0;
  background: rgba(241, 245, 249, 0.9);
  color: #334155;
  font-size: 15px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
}

.shell-mini-icon-btn:hover {
  background: #ffffff;
  border-color: var(--menu-theme-color);
  transform: translateY(-1px);
}

.shell-start-icon-wrap {
  width: 74px;
  height: 74px;
  border-radius: 22px;
  background: var(--menu-tint-bg);
  border: 2px solid var(--menu-theme-color);
  box-shadow: 0 10px 24px var(--menu-glow-rgba);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.shell-start-icon {
  width: 58px;
  height: 58px;
  object-fit: contain;
}

.shell-start-title {
  font-size: 25px;
  font-weight: 900;
  line-height: 1.14;
  letter-spacing: -0.5px;
  color: #0f172a;
  margin: 0;
}

/* Difficulty Selector (Kolay / Normal / Zor) */
.shell-difficulty-group {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  width: 100%;
  background: #f1f5f9;
  padding: 5px;
  border-radius: 16px;
  border: 1px solid #e2e8f0;
}

.shell-diff-btn {
  appearance: none;
  border: none;
  background: transparent;
  color: #475569;
  font-size: 13px;
  font-weight: 800;
  padding: 9px 6px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.16s ease;
}

.shell-diff-btn:hover {
  color: #0f172a;
}

.shell-diff-btn.is-active {
  background: var(--menu-accent-gradient);
  color: #ffffff;
  box-shadow: 0 4px 12px var(--menu-glow-rgba);
}

.shell-start-play-btn {
  width: 100%;
  background: var(--menu-accent-gradient);
  color: #ffffff;
  font-size: 19px;
  font-weight: 900;
  letter-spacing: 1.2px;
  padding: 15px 24px;
  border-radius: 16px;
  border: none;
  cursor: pointer;
  box-shadow: 0 5px 0 rgba(15, 23, 42, 0.26), 0 12px 26px var(--menu-glow-rgba);
  transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.shell-start-play-btn:hover {
  filter: brightness(1.06);
  transform: translateY(-2px);
  box-shadow: 0 7px 0 rgba(15, 23, 42, 0.28), 0 16px 30px var(--menu-glow-rgba);
}

.shell-start-play-btn:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 rgba(15, 23, 42, 0.26), 0 6px 12px var(--menu-glow-rgba);
}

.ad-mock-creative {

  .shell-sidebar-right {
    display: none !important;

  }
  .shell-start-card {
    padding: 22px 18px 20px;
    max-width: 340px;
  }
  .shell-start-title {
    font-size: 22px;
  }
}
