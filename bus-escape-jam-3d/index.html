<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>BUS ESCAPE 3D // PASSENGER JAM</title>
    <!-- YouTube Playables SDK -->
    <script src="https://www.youtube.com/game_api/v1"></script>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <style>
      :root {
        --color-primary: #f59e0b;
        --color-accent: #ef4444;
        --color-bg: #cfe8f7;
        --color-surface: #ffffff;
        --color-text: #0f172a;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--color-bg);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: var(--color-text);
      }

      /* Dual-Mode Embed Collapse */
      

      /* Disabled state when ads are unavailable */
      body.ads-unavailable .booster-btn,
      body.ads-unavailable [data-ad-hook="booster"] {
        opacity: 0.35 !important;
        pointer-events: none !important;
      }

      #arcade-shell {
        display: flex;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background-color: var(--color-bg);
      }

      .shell-stage {
        position: relative;
        flex: 1;
        height: 100%;
        overflow: hidden;
      }

      #app {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      #hud {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 16px;
      }

      .hud-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
      }

      .hud-stat-pill {
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(8px);
        border: 2px solid #e2e8f0;
        border-radius: 20px;
        padding: 6px 16px;
        font-weight: 800;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
      }

      .hud-btn-group {
        display: flex;
        gap: 8px;
      }

      .hud-btn {
        background: rgba(255, 255, 255, 0.92);
        border: 2px solid #e2e8f0;
        border-radius: 50%;
        width: 42px;
        height: 42px;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
        pointer-events: auto;
      }

      .booster-bar {
        display: flex;
        justify-content: center;
        gap: 12px;
        width: 100%;
        margin-bottom: 8px;
      }

      .booster-btn {
        background: rgba(255, 255, 255, 0.95);
        border: 2px solid #fcd34d;
        border-radius: 16px;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 800;
        color: #1e293b;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 6px 16px rgba(245, 158, 11, 0.2);
        pointer-events: auto;
        transition: transform 0.15s ease;
      }
      .booster-btn:active {
        transform: scale(0.95);
      }

      /* Modals */
      .modal-overlay {
        position: absolute;
        inset: 0;
        background: rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        pointer-events: auto;
      }

      .modal-card {
        background: #ffffff;
        border-radius: 24px;
        padding: 24px;
        width: 90%;
        max-width: 360px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .countdown-badge {
        font-size: 24px;
        font-weight: 900;
        color: #ef4444;
      }

      .multiplier-gauge-wrap {
        position: relative;
        height: 28px;
        background: linear-gradient(90deg, #f59e0b, #10b981, #3b82f6, #ec4899);
        border-radius: 14px;
        overflow: hidden;
      }
      .multiplier-needle {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 6px;
        background: #ffffff;
        box-shadow: 0 0 8px #000;
        transform: translateX(-50%);
      }
      .multiplier-label {
        font-size: 28px;
        font-weight: 900;
        color: #f59e0b;
      }

      .primary-btn {
        background: linear-gradient(135deg, #f59e0b, #d97706);
        color: #ffffff;
        border: none;
        border-radius: 14px;
        padding: 12px;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
      }

      .secondary-btn {
        background: #f1f5f9;
        color: #64748b;
        border: none;
        border-radius: 14px;
        padding: 10px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
                                                                  <style id="shared-arcade-shell-css">
/* ==========================================================================
   SHARED ARCADE 3-COLUMN SHELL CSS (LEFT NAV + CENTER STAGE + RIGHT AD RAIL)
   Single Source of Truth across all HTML5 3D Arcade Games
   Game content (#app & #hud) is 100% isolated inside #shell-stage.
   ========================================================================== */

/* Automatic Disabled State When Ads Are Unavailable (Offline / AdBlocker / No Inventory) */
body.ads-unavailable .booster-btn,
body.ads-unavailable .hud-booster-btn,
body.ads-unavailable [data-ad-hook="booster"] {
  opacity: 0.35 !important;
  pointer-events: none !important;
  cursor: not-allowed !important;
}

body.ads-unavailable .btn-revive,
body.ads-unavailable .btn-multiplier,
body.ads-unavailable [data-ad-hook="revive"],
body.ads-unavailable [data-ad-hook="multiplier"] {
  display: none !important;
}

#arcade-shell,
.arcade-shell {
  display: flex !important;
  flex-direction: row !important;
  width: 100vw !important;
  height: 100vh !important;
  height: 100dvh !important;
  overflow: hidden !important;
  background: #cfe8f7;
  color: #fff;
  position: relative;
}

/* Left Sidebar Navigation — Always Visible & Identical Across All Games */
.shell-sidebar-left {
  width: 260px !important;
  min-width: 260px !important;
  max-width: 260px !important;
  height: 100% !important;
  background: rgba(13, 16, 28, 0.96) !important;
  border-right: 1px solid rgba(56, 189, 248, 0.2) !important;
  display: flex !important;
  flex-direction: column !important;
  padding: 18px 14px !important;
  gap: 16px !important;
  z-index: 50 !important;
  flex-shrink: 0 !important;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
}

.shell-brand {
  margin-bottom: 2px;
}

.shell-brand-link {
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  color: inherit;
}

.shell-brand-badge {
  background: rgba(56, 189, 248, 0.15);
  border: 1px solid #38bdf8;
  color: #38bdf8;
  font-size: 10px;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: 4px;
  letter-spacing: 1px;
}

.shell-brand-title {
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 1.5px;
  background: linear-gradient(135deg, #fff, #94a3b8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.shell-nav {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.shell-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(30, 41, 59, 0.7);
  border: 1px solid rgba(56, 189, 248, 0.25);
  color: #e2e8f0;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.15s ease;
}

.shell-btn:hover {
  background: rgba(56, 189, 248, 0.18);
  border-color: #38bdf8;
  color: #fff;
  transform: translateY(-1px);
}

.shell-btn .btn-icon {
  font-size: 15px;
}

/* Explicitly hide any legacy fullscreen button or banner */
#shell-fullscreen-btn,
.shell-btn-fullscreen,
#fullscreen-ad-banner,
.fullscreen-ad-banner {
  display: none !important;
}

.shell-other-games {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 0;
  flex: 1 1 auto;
}

.shell-section-title {
  font-size: 11px;
  font-weight: 700;
  color: #64748b;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin: 0;
}

.other-games-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
  flex: 1 1 auto;
}

.other-game-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  background: rgba(15, 23, 42, 0.8);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 8px;
  text-decoration: none;
  color: #cbd5e1;
  transition: all 0.15s ease;
}

.other-game-item:hover {
  background: rgba(56, 189, 248, 0.12);
  border-color: rgba(56, 189, 248, 0.4);
  color: #fff;
}

.other-game-icon {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  object-fit: cover;
  flex-shrink: 0;
}

.other-game-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow: hidden;
}

.other-game-title {
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.other-game-tag {
  font-size: 10px;
  color: #38bdf8;
}

/* Center Game Stage — 100% Isolated Viewport Container for the Game (#app + #hud) */
#shell-stage,
.shell-stage {
  flex: 1 1 auto !important;
  min-width: 0 !important;
  width: auto !important;
  height: 100% !important;
  position: relative !important;
  overflow: hidden !important;
  background: #cfe8f7;
  display: flex !important;
  flex-direction: column !important;
  /* CSS containment + transform traps any position:fixed modals/HUD strictly inside the game stage */
  transform: translateZ(0);
  contain: layout paint;
}

#app,
.game-canvas-container {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  touch-action: none;
  z-index: 1;
}

#app canvas,
.game-canvas-container canvas {
  display: block;
  width: 100% !important;
  height: 100% !important;
}

#hud,
.game-hud-overlay {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  pointer-events: none;
  z-index: 20;
  overflow: hidden;
}

/* Right Ad Rail — Always Visible & Identical on Desktop */
.shell-sidebar-right {
  width: 320px !important;
  min-width: 320px !important;
  max-width: 320px !important;
  height: 100% !important;
  background: rgba(13, 16, 28, 0.96) !important;
  border-left: 1px solid rgba(56, 189, 248, 0.2) !important;
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  justify-content: center !important;
  padding: 16px 10px !important;
  z-index: 50 !important;
  flex-shrink: 0 !important;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
}

.ad-rail-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.ad-header-tag {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: #64748b;
}

.ad-banner-slot {
  width: 300px;
  height: 600px;
  background: linear-gradient(180deg, #1e293b, #0f172a);
  border: 1px solid rgba(56, 189, 248, 0.2);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.ad-mock-creative {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  z-index: 2;
}

.ad-mock-glow {
  position: absolute;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(56, 189, 248, 0.25), transparent);
  top: 20%;
  pointer-events: none;
}

.ad-mock-brand {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 2px;
  margin: 0;
  color: #fff;
}

.ad-mock-desc {
  font-size: 13px;
  color: #94a3b8;
  margin: 0;
  max-width: 220px;
}

.ad-mock-cta {
  margin-top: 10px;
  background: linear-gradient(135deg, #38bdf8, #0284c7);
  color: #fff;
  padding: 12px 28px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 1.5px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(14, 165, 233, 0.4);
}

/* Responsive Layout for Narrow Mobile/Tablet Screens */
@media (max-width: 1024px) {
  .shell-sidebar-right {
    display: none !important;
  }
}

@media (max-width: 768px) {
  #arcade-shell,
  .arcade-shell {
    flex-direction: column !important;
  }
  .shell-sidebar-left {
    width: 100% !important;
    min-width: 100% !important;
    max-width: 100% !important;
    height: auto !important;
    flex-direction: row !important;
    align-items: center !important;
    justify-content: space-between !important;
    padding: 8px 12px !important;
    border-right: none !important;
    border-bottom: 1px solid rgba(56, 189, 248, 0.2) !important;
  }
  .shell-other-games {
    display: none !important;
  }
  .shell-nav {
    flex-direction: row !important;
    gap: 6px !important;
  }
  .shell-btn {
    padding: 6px 10px !important;
    font-size: 11px !important;
  }
}

    </style>
  </head>
  <body>
    <div id="arcade-shell" class="arcade-shell">
                                                                        <!-- Left Navigation Rail -->
      <aside class="shell-sidebar shell-sidebar-left">
        <div class="shell-brand">
          <a href="../" class="shell-brand-link">
            <span class="shell-brand-badge">ARCADE</span>
            <span class="shell-brand-title">3D GAMES</span>
          </a>
        </div>

        <nav class="shell-nav">
          <a href="../" class="shell-btn shell-btn-portal" title="Return to Central Arcade Portal">
            <span class="btn-icon">←</span> Portala Dön
          </a>
          <button id="shell-restart-btn" class="shell-btn shell-btn-restart" type="button">
            <span class="btn-icon">🔄</span> Yeniden Başlat
          </button>
        </nav>

        <section class="shell-other-games">
          <h3 class="shell-section-title">Diğer Oyunlar</h3>
          <div id="shell-other-games-list" class="other-games-list">
            <!-- Hydrated dynamically from ../games.json -->
          </div>
        </section>
      </aside>

      <!-- Center Game Stage -->
      <main class="shell-stage">

        <div id="app"></div>

        <div id="hud">
          <header class="hud-header">
            <div class="hud-stat-pill">
              <span>LEVEL</span>
              <span id="level-num">1</span>
            </div>
            <div class="hud-stat-pill">
              <span>🪙</span>
              <span id="coin-count">100</span>
            </div>
            <div class="hud-btn-group">
              <button id="sound-btn" class="hud-btn" data-hud-interactive="true">🔊</button>
              <button id="restart-btn" class="hud-btn" data-hud-interactive="true">🔄</button>
            </div>
          </header>

          <footer class="booster-bar">
            <button id="booster-helo" class="booster-btn" data-hud-interactive="true">
              <span>🚁</span>
              <span>HELO LIFT</span>
            </button>
            <button id="booster-vip" class="booster-btn" data-hud-interactive="true">
              <span>🅿️</span>
              <span>VIP BAY</span>
            </button>
            <button id="booster-shuffle" class="booster-btn" data-hud-interactive="true">
              <span>🔀</span>
              <span>SHUFFLE</span>
            </button>
          </footer>
        </div>
      </main>

                                                                        <!-- Right Advertising Rail -->
      <aside class="shell-sidebar shell-sidebar-right">
        <div class="ad-rail-wrapper">
          <span class="ad-header-tag">SPONSOR // REKLAM</span>
          <div id="ad-banner-desktop" class="ad-banner-slot banner-300x600">
            <div class="ad-mock-creative">
              <div class="ad-mock-glow"></div>
              <p class="ad-mock-brand">BUS ESCAPE 3D</p>
              <p class="ad-mock-desc">Zero-install 60 FPS WebGL 3D Arcade</p>
              <div class="ad-mock-cta">ŞİMDİ OYNA</div>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
