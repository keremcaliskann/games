<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe8f7" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <linearGradient id="busBodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#skyGrad)" />

  <!-- Asphalt Road Strip -->
  <path d="M 40,360 L 472,360 C 490,360 490,460 450,460 L 62,460 C 22,460 22,360 40,360 Z" fill="#fcf8ee" opacity="0.9" />
  <line x1="80" y1="410" x2="432" y2="410" stroke="#cbd5e1" stroke-width="8" stroke-dasharray="24 16" stroke-linecap="round" />

  <!-- Toy Bus Group -->
  <g filter="url(#dropShadow)" transform="translate(64, 110)">
    <!-- Main Chassis -->
    <rect x="20" y="40" width="344" height="190" rx="36" fill="url(#busBodyGrad)" />
    
    <!-- White Roof Rack Strip -->
    <rect x="40" y="24" width="304" height="24" rx="10" fill="#ffffff" opacity="0.95" />
    
    <!-- Windshield & Windows -->
    <rect x="44" y="68" width="80" height="72" rx="14" fill="url(#glassGrad)" />
    <rect x="138" y="68" width="60" height="72" rx="12" fill="url(#glassGrad)" />
    <rect x="212" y="68" width="60" height="72" rx="12" fill="url(#glassGrad)" />
    <rect x="286" y="68" width="60" height="72" rx="12" fill="url(#glassGrad)" />

    <!-- Cute Passenger Pawns inside windows -->
    <circle cx="168" cy="100" r="14" fill="#3b82f6" />
    <circle cx="242" cy="100" r="14" fill="#ef4444" />
    <circle cx="316" cy="100" r="14" fill="#10b981" />

    <!-- Headlights -->
    <circle cx="38" cy="170" r="14" fill="#fef08a" />
    <circle cx="38" cy="170" r="8" fill="#ffffff" />
    
    <!-- Smile Bumper -->
    <path d="M 60,195 Q 192,220 324,195" stroke="#334155" stroke-width="8" stroke-linecap="round" fill="none" />

    <!-- Wheels -->
    <g transform="translate(76, 215)">
      <circle cx="0" cy="0" r="32" fill="#1e293b" />
      <circle cx="0" cy="0" r="16" fill="#e2e8f0" />
      <circle cx="0" cy="0" r="8" fill="#f59e0b" />
    </g>
    <g transform="translate(288, 215)">
      <circle cx="0" cy="0" r="32" fill="#1e293b" />
      <circle cx="0" cy="0" r="16" fill="#e2e8f0" />
      <circle cx="0" cy="0" r="8" fill="#f59e0b" />
    </g>
  </g>

  <!-- Speed Dash lines -->
  <path d="M 28,190 L 64,190" stroke="#fcd34d" stroke-width="8" stroke-linecap="round" />
  <path d="M 16,220 L 56,220" stroke="#fcd34d" stroke-width="8" stroke-linecap="round" />
</svg>
