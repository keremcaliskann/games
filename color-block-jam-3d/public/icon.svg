<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="metalGate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="laserGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0" />
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shredSparks" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded frame -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" />

  <!-- Isometric Board Grid Silhouette -->
  <path d="M 256 90 L 440 196 L 256 302 L 72 196 Z" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="2" />
  <path d="M 256 125 L 395 205 L 256 285 L 117 205 Z" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="1.5" />

  <!-- Shredder Gate Frame on Top-Right -->
  <path d="M 360 140 L 440 186 L 440 226 L 360 180 Z" fill="url(#metalGate)" stroke="#94a3b8" stroke-width="3" />
  <line x1="375" y1="150" x2="425" y2="180" stroke="#ef4444" stroke-width="5" filter="url(#glowEffect)" />
  <!-- Shredder Teeth / Rollers -->
  <ellipse cx="400" cy="180" rx="20" ry="12" fill="#475569" stroke="#cbd5e1" stroke-width="2" transform="rotate(-30 400 180)" />
  <line x1="390" y1="175" x2="410" y2="185" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" />

  <!-- 3D Polyomino Block 1: Blue L-Block -->
  <g transform="translate(140, 180)">
    <!-- Top Face -->
    <path d="M 60 0 L 110 28 L 60 56 L 10 28 Z" fill="#60a5fa" />
    <!-- Left Face -->
    <path d="M 10 28 L 60 56 L 60 90 L 10 62 Z" fill="#2563eb" />
    <!-- Right Face -->
    <path d="M 60 56 L 110 28 L 110 62 L 60 90 Z" fill="#1d4ed8" />
  </g>

  <!-- 3D Polyomino Block 2: Yellow Square Block -->
  <g transform="translate(200, 215)">
    <path d="M 50 0 L 90 22 L 50 44 L 10 22 Z" fill="#fde047" />
    <path d="M 10 22 L 50 44 L 50 72 L 10 50 Z" fill="#ca8a04" />
    <path d="M 50 44 L 90 22 L 90 50 L 50 72 Z" fill="#a16207" />
  </g>

  <!-- 3D Polyomino Block 3: Green Long Block -->
  <g transform="translate(100, 240)">
    <path d="M 50 0 L 120 40 L 70 68 L 0 28 Z" fill="#4ade80" />
    <path d="M 0 28 L 70 68 L 70 96 L 0 56 Z" fill="#16a34a" />
    <path d="M 70 68 L 120 40 L 120 68 L 70 96 Z" fill="#15803d" />
  </g>

  <!-- Red Block Being Shredded into Flying Voxels into Gate -->
  <g transform="translate(290, 160)">
    <path d="M 40 0 L 80 23 L 40 46 L 0 23 Z" fill="url(#redGrad)" />
    <path d="M 0 23 L 40 46 L 40 70 L 0 47 Z" fill="#b91c1c" />
    <path d="M 40 46 L 80 23 L 80 47 L 40 70 Z" fill="#991b1b" />
  </g>

  <!-- Flying Shredded Voxels & Energy Particles -->
  <g filter="url(#shredSparks)">
    <rect x="380" y="130" width="14" height="14" rx="3" fill="#f87171" transform="rotate(25 380 130)" />
    <rect x="420" y="110" width="12" height="12" rx="2" fill="#ef4444" transform="rotate(45 420 110)" />
    <rect x="405" y="150" width="10" height="10" rx="2" fill="#fde047" transform="rotate(15 405 150)" />
    <rect x="445" y="140" width="15" height="15" rx="3" fill="#fca5a5" transform="rotate(-30 445 140)" />
    <circle cx="395" cy="120" r="4" fill="#ffffff" />
    <circle cx="430" cy="165" r="5" fill="#fef08a" />
    <circle cx="460" cy="125" r="3" fill="#fda4af" />
  </g>

  <!-- Motion Trails / Speed Arrows -->
  <path d="M 270 205 L 320 180" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" stroke-linecap="round" />
  <polygon points="325,178 315,174 318,184" fill="#38bdf8" />

  <!-- Badge Banner at Bottom -->
  <rect x="56" y="380" width="400" height="78" rx="22" fill="#0f172a" fill-opacity="0.95" stroke="#38bdf8" stroke-width="2.5" />
  <text x="256" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">COLOR JAM 3D</text>
  <text x="256" y="443" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="4">SHREDDER ESCAPE</text>
</svg>
